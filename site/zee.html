<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>• Zee — Spiegel → Chaos</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06060a; color: #e0e0e0; font-family: 'IBM Plex Mono', monospace; overflow: hidden; }
    canvas { display: block; }

    .ui {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 10; transition: opacity 1s;
    }

    .element-label { font-size: 1.4em; color: #7c6ef5; margin-bottom: 4px; }
    .element-sub { font-size: 0.7em; color: #666; margin-bottom: 12px; }

    .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .btn {
      background: rgba(124,110,245,0.05); border: 1px solid rgba(124,110,245,0.15);
      color: #888; padding: 6px 14px; border-radius: 4px; cursor: pointer;
      font-family: inherit; font-size: 0.75em; transition: all 0.3s;
    }
    .btn:hover { background: rgba(124,110,245,0.15); }
    .btn.active { background: rgba(124,110,245,0.2); border-color: rgba(124,110,245,0.4); color: #c0b8e8; }

    .stone-btn {
      margin-top: 10px;
      background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2);
      color: #fbbf26; padding: 8px 20px; border-radius: 20px; cursor: pointer;
      font-family: inherit; font-size: 0.85em; transition: all 0.5s;
    }
    .stone-btn:hover { background: rgba(251,191,36,0.15); }
    .stone-btn.rippled { background: rgba(251,191,36,0.25); border-color: rgba(251,191,36,0.5); box-shadow: 0 0 20px rgba(251,191,36,0.1); }

    .back-link {
      position: fixed; top: 20px; left: 20px; color: #555; text-decoration: none;
      font-size: 0.8em; z-index: 10; transition: color 0.3s;
    }
    .back-link:hover { color: #7c6ef5; }

    .info {
      position: fixed; top: 20px; right: 20px; color: #444; font-size: 0.65em;
      text-align: right; z-index: 10;
    }
  </style>
</head>
<body>
  <a href="bit.html" class="back-link">← bit</a>
  <a href="index.html" class="back-link" style="top:50px;">← hexa-book</a>
  <div class="info" id="info">spiegel — stil</div>

  <canvas id="c"></canvas>

  <div class="ui" id="ui">
    <div class="element-label" id="el-label">zee</div>
    <div class="element-sub" id="el-sub">spiegel → steen → rimpel → chaos</div>
    <button class="stone-btn" id="stone-btn">● steen gooien</button>
  </div>

<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const infoEl = document.getElementById('info');
  const uiEl = document.getElementById('ui');
  const elLabel = document.getElementById('el-label');
  const elSub = document.getElementById('el-sub');
  const stoneBtn = document.getElementById('stone-btn');

  let W, H, cx, cy;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Concept: Spiegel → Steen → Rimpel → Chaos ──
  //
  // Stil = pure spiegel. Alleen subtiele stroming zichtbaar.
  // Steen gooien = geluid AAN → ripple effect → butterfly effect
  // Geluid volgt beeld. Beeld volgt geluid.
  // Chaos is niet willekeurig — het is de natuurlijke uitkomst van de ripple.

  let time = 0;
  let audioOn = false;
  let rippleTime = 0; // tijd sinds steen gegooid
  let stones = []; // gegooiden stenen met positie + tijd

  // ── Audio ──
  let audioCtx = null;
  let audioNodes = null;

  function initAudio() {
    if (audioCtx) return true;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const bufSize = audioCtx.sampleRate * 4;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const bp1 = audioCtx.createBiquadFilter();
    bp1.type = 'bandpass'; bp1.frequency.value = 300; bp1.Q.value = 0.5;
    const bp2 = audioCtx.createBiquadFilter();
    bp2.type = 'bandpass'; bp2.frequency.value = 300; bp2.Q.value = 0.5;

    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.2;
    lfoGain.gain.value = 100;
    lfo.connect(lfoGain);
    lfoGain.connect(bp1.frequency);
    lfo.start();

    const master = audioCtx.createGain();
    master.gain.value = 0; // start stil

    noise.connect(bp1); noise.connect(bp2);
    bp1.connect(master); bp2.connect(master);
    master.connect(audioCtx.destination);
    noise.start();

    audioNodes = { noise, bp1, bp2, lfo, lfoGain, master };
    return true;
  }

  function setAudio(on) {
    if (!audioNodes) return;
    const t = 1;
    const n = audioNodes;

    if (on) {
      // Steen in water = lage frequentie + trage golven
      n.bp1.frequency.setTargetAtTime(200, audioCtx.currentTime, t);
      n.bp1.Q.setTargetAtTime(0.5, audioCtx.currentTime, t);
      n.bp2.frequency.setTargetAtTime(1500, audioCtx.currentTime, t);
      n.bp2.Q.setTargetAtTime(1, audioCtx.currentTime, t);
      n.lfo.frequency.setTargetAtTime(0.1, audioCtx.currentTime, t);
      n.lfoGain.gain.setTargetAtTime(100, audioCtx.currentTime, t);
      n.master.gain.setTargetAtTime(0.1, audioCtx.currentTime, t);
    } else {
      n.master.gain.setTargetAtTime(0, audioCtx.currentTime, t);
    }
  }

  // ── Stroming: de onzichtbare kracht ──
  // In stilte: subtiele stroming (niet direct zichtbaar)
  // Na steen: stroming wordt sterker, zichtbaar, chaotisch

  // Height map = de oppervlakte van het water
  // Stil: platte lijn
  // Na steen: sinusgolven die uitbreiden

  function getWaterHeight(x, y, t) {
    let h = 0;

    // Basis stroming (altijd aanwezig, niet zichtbaar in stilte)
    h += Math.sin(x * 0.003 + t * 0.1) * 2;
    h += Math.cos(y * 0.004 + t * 0.08) * 2;

    // Ripple van gegooiden stenen
    for (let i = 0; i < stones.length; i++) {
      const s = stones[i];
      const age = t - s.time;
      const dx = x - s.x;
      const dy = y - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Uitbreidende ring
      const speed = 100; // pixels per second
      const ringDist = age * speed;
      const ringWidth = 50 + age * 20;

      if (Math.abs(dist - ringDist) < ringWidth) {
        const ripple = Math.sin((dist - ringDist) * 0.05) *
                       Math.exp(-age * 0.3) *
                       Math.exp(-Math.abs(dist - ringDist) / ringWidth);
        h += ripple * 30;
      }

      // Secundaire rimpels (butterfly effect)
      if (age > 1) {
        const chaosFreq = 0.02 + age * 0.01;
        const chaosAmp = Math.min(1, age * 0.1) * Math.exp(-age * 0.1);
        h += Math.sin(dist * chaosFreq + t * 2) * chaosAmp * 5;
      }
    }

    return h;
  }

  // ── Visuals ──
  const COLORS = {
    mirror: '100, 140, 220',    // stil water
    ripple: '124, 110, 245',    // rimpel
    chaos:  '251, 191, 36',     // chaos
  };

  function draw() {
    // Fade = continue laag
    ctx.fillStyle = 'rgba(6, 6, 10, 0.02)';
    ctx.fillRect(0, 0, W, H);

    time += 0.016;
    if (audioOn) rippleTime += 0.016;

    // ── Spiegel: horizontale lijnen ──
    // Stil: platte lijnen met subtiele stroming
    // Na steen: golven die uitbreiden

    const lineCount = Math.floor(H / 8);
    for (let i = 0; i < lineCount; i++) {
      const yBase = i * 8;

      // Hoe zichtbaar is de beweging?
      let visibility;
      if (!audioOn) {
        visibility = 0.01 + Math.sin(time * 0.1) * 0.005;
      } else {
        const chaos = Math.min(1, rippleTime * 0.05);
        visibility = 0.02 + chaos * 0.03;
      }

      ctx.beginPath();
      for (let x = 0; x < W; x += 4) {
        const h = getWaterHeight(x, yBase, time);
        const y = yBase + h * 0.3;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      // Kleur verandert met chaos
      let color;
      if (!audioOn) {
        color = COLORS.mirror;
      } else if (rippleTime < 3) {
        color = COLORS.ripple;
      } else {
        // Langzaam naar chaos kleur
        const chaos = Math.min(1, (rippleTime - 3) * 0.05);
        const r = 100 + chaos * 151;
        const g = 140 - chaos * 49;
        const b = 220 - chaos * 184;
        color = `${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}`;
      }

      ctx.strokeStyle = `rgba(${color}, ${visibility})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // ── Ripple visuals ──
    if (audioOn) {
      for (let i = 0; i < stones.length; i++) {
        const s = stones[i];
        const age = time - s.time;
        const speed = 100;
        const ringDist = age * speed;
        const alpha = Math.exp(-age * 0.2) * 0.3;

        if (alpha > 0.01) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, ringDist, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(124, 110, 245, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    // ── Stroming indicators (subtiel) ──
    // Alleen zichtbaar als je kijkt
    if (!audioOn) {
      // Stil: bijna onzichtbare deeltjes
      for (let i = 0; i < 5; i++) {
        const px = cx + Math.sin(time * 0.05 + i * 2) * W * 0.4;
        const py = cy + Math.cos(time * 0.04 + i * 3) * H * 0.4;
        const h = getWaterHeight(px, py, time);

        ctx.beginPath();
        ctx.arc(px, py, 0.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(100, 140, 220, ${0.02 + Math.abs(h) * 0.001})`;
        ctx.fill();
      }
    }

    // ── Info ──
    if (!audioOn) {
      infoEl.textContent = 'spiegel — stil';
    } else if (rippleTime < 3) {
      infoEl.textContent = `rimpel — ${rippleTime.toFixed(1)}s`;
    } else if (rippleTime < 10) {
      infoEl.textContent = `butterfly effect — ${rippleTime.toFixed(1)}s`;
    } else {
      infoEl.textContent = `chaos — ${rippleTime.toFixed(1)}s`;
    }

    requestAnimationFrame(draw);
  }

  // ── Stone throw ──
  stoneBtn.addEventListener('click', () => {
    initAudio();
    audioOn = !audioOn;
    setAudio(audioOn);

    if (audioOn) {
      // Steen gooien!
      stones.push({
        x: cx + (Math.random() - 0.5) * W * 0.3,
        y: cy + (Math.random() - 0.5) * H * 0.3,
        time: time
      });
      stoneBtn.textContent = '● stil';
      stoneBtn.classList.add('rippled');
      elSub.textContent = 'steen → rimpel → butterfly → chaos';
    } else {
      // Terug naar spiegel
      stones = [];
      rippleTime = 0;
      stoneBtn.textContent = '● steen gooien';
      stoneBtn.classList.remove('rippled');
      elSub.textContent = 'spiegel → steen → rimpel → chaos';
    }
  });

  // Click op canvas = steen gooien op die plek
  canvas.addEventListener('click', (e) => {
    if (!audioOn) {
      initAudio();
      audioOn = true;
      setAudio(true);
      stoneBtn.textContent = '● stil';
      stoneBtn.classList.add('rippled');
    }

    stones.push({
      x: e.clientX,
      y: e.clientY,
      time: time
    });
  });

  // Start
  draw();
})();
</script>
</body>
</html>
