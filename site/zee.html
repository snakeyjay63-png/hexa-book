<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>• Zee — Hexa-Book Kunstwerk</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06060a; color: #e0e0e0; font-family: 'IBM Plex Mono', monospace; overflow: hidden; }
    canvas { display: block; }

    .ui { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; }
    .element-label { font-size: 1.4em; color: #7c6ef5; margin-bottom: 8px; }
    .element-sub { font-size: 0.8em; color: #888; margin-bottom: 16px; }

    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      background: rgba(124,110,245,0.1); border: 1px solid rgba(124,110,245,0.3);
      color: #c0b8e8; padding: 10px 20px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 0.85em; transition: all 0.3s;
    }
    .btn:hover { background: rgba(124,110,245,0.25); }
    .btn.active { background: rgba(124,110,245,0.35); border-color: #7c6ef5; color: #fff; }

    .speed-row { margin-top: 12px; display: flex; gap: 8px; justify-content: center; align-items: center; }
    .speed-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
      color: #888; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.75em;
    }
    .speed-btn:hover { background: rgba(255,255,255,0.1); }

    .back-link {
      position: fixed; top: 20px; left: 20px; color: #555; text-decoration: none;
      font-size: 0.8em; z-index: 10; transition: color 0.3s;
    }
    .back-link:hover { color: #7c6ef5; }
  </style>
</head>
<body>
  <a href="bit.html" class="back-link">← bit</a>
  <a href="index.html" class="back-link" style="top:50px;">← hexa-book</a>

  <canvas id="c"></canvas>

  <div class="ui">
    <div class="element-label" id="el-label">schelp</div>
    <div class="element-sub" id="el-sub">schelp op oor — zee</div>
    <div class="btn-row">
      <button class="btn active" data-e="schelp">schelp</button>
      <button class="btn" data-e="zee">zee</button>
      <button class="btn" data-e="regen">regen</button>
      <button class="btn" data-e="water">water</button>
      <button class="btn" data-e="wind">wind</button>
    </div>
    <div class="speed-row">
      <button class="speed-btn" data-s="0.5">0.5×</button>
      <button class="speed-btn active" data-s="1">1×</button>
      <button class="speed-btn" data-s="2">2×</button>
    </div>
  </div>

<script>
  // ── Canvas ──
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Audio: één white noise bron, filters = element ──
  let audioCtx = null;
  let audioNodes = null;
  let currentElement = 'schelp';

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // Eén white noise bron (altijd aan)
    const bufSize = audioCtx.sampleRate * 4;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    // Filter 1: bandpass (zee/schelp)
    const bp1 = audioCtx.createBiquadFilter();
    bp1.type = 'bandpass';
    bp1.frequency.value = 300;
    bp1.Q.value = 0.5;

    // Filter 2: bandpass (regen/water)
    const bp2 = audioCtx.createBiquadFilter();
    bp2.type = 'bandpass';
    bp2.frequency.value = 300;
    bp2.Q.value = 0.5;

    // LFO = trage modulator (golvend/geweld)
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.2; // langzaam = zee-golf
    lfoGain.gain.value = 100;
    lfo.connect(lfoGain);
    lfoGain.connect(bp1.frequency); // moduleert filter frequentie
    lfo.start();

    // Master
    const master = audioCtx.createGain();
    master.gain.value = 0.1;

    // Routing
    noise.connect(bp1);
    noise.connect(bp2);
    bp1.connect(master);
    bp2.connect(master);
    master.connect(audioCtx.destination);
    noise.start();

    audioNodes = { noise, bp1, bp2, lfo, lfoGain, master };
  }

  function setElement(el) {
    currentElement = el;
    const n = audioNodes;
    const t = 1; // smooth ramp (1 seconde)

    switch(el) {
      case 'schelp': // schelp op oor = zee-brom (laag, breed)
        n.bp1.frequency.setTargetAtTime(250, audioCtx.currentTime, t);
        n.bp1.Q.setTargetAtTime(0.3, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(500, audioCtx.currentTime, t);
        n.bp2.Q.setTargetAtTime(0.2, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(0.15, audioCtx.currentTime, t);  // trage golf
        n.lfoGain.gain.setTargetAtTime(80, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.12, audioCtx.currentTime, t);
        break;

      case 'zee': // zee = golven + wind + schuim
        n.bp1.frequency.setTargetAtTime(200, audioCtx.currentTime, t);
        n.bp1.Q.setTargetAtTime(0.5, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(2000, audioCtx.currentTime, t); // schuim!
        n.bp2.Q.setTargetAtTime(1, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(0.1, audioCtx.currentTime, t);  // langzame golf
        n.lfoGain.gain.setTargetAtTime(120, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.1, audioCtx.currentTime, t);
        break;

      case 'regen': // regen = hoog + snel + druppels
        n.bp1.frequency.setTargetAtTime(4000, audioCtx.currentTime, t);
        n.bp1.Q.setTargetAtTime(2, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(6000, audioCtx.currentTime, t);
        n.bp2.Q.setTargetAtTime(3, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(2, audioCtx.currentTime, t);    // snel = druppels
        n.lfoGain.gain.setTargetAtTime(500, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.06, audioCtx.currentTime, t);
        break;

      case 'water': // water = mid + stromend + droppend
        n.bp1.frequency.setTargetAtTime(800, audioCtx.currentTime, t);
        n.bp1.Q.setTargetAtTime(1.5, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(1500, audioCtx.currentTime, t);
        n.bp2.Q.setTargetAtTime(1, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(0.5, audioCtx.currentTime, t);  // medium = stroom
        n.lfoGain.gain.setTargetAtTime(300, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.08, audioCtx.currentTime, t);
        break;

      case 'wind': // wind = laag + sweep + zuigend
        n.bp1.frequency.setTargetAtTime(150, audioCtx.currentTime, t);
        n.bp1.Q.setTargetAtTime(0.8, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(800, audioCtx.currentTime, t);
        n.bp2.Q.setTargetAtTime(2, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(0.3, audioCtx.currentTime, t);  // langzaam sweep
        n.lfoGain.gain.setTargetAtTime(400, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.1, audioCtx.currentTime, t);
        break;
    }
  }

  // ── Visuals: particle field per element ──
  let time = 0;
  let particles = [];

  // Fade buffer = continue transform (geen clearRect)
  const fadeAlpha = 0.03;

  function spawnParticles(count, type) {
    for (let i = 0; i < count; i++) {
      particles.push(createParticle(type));
    }
  }

  function createParticle(type) {
    const p = {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0, vy: 0,
      life: 1,
      decay: 0.001 + Math.random() * 0.003,
      size: 1 + Math.random() * 2,
    };

    switch(type) {
      case 'schelp': // cirkelvormig, zacht draaiend
        const angle = Math.random() * Math.PI * 2;
        const radius = 100 + Math.random() * 200;
        p.x = cx + Math.cos(angle) * radius;
        p.y = cy + Math.sin(angle) * radius;
        p.vx = Math.cos(angle + Math.PI/2) * 0.2;
        p.vy = Math.sin(angle + Math.PI/2) * 0.2;
        p.size = 1 + Math.random();
        break;

      case 'zee': // golven, horizontaal + opwaarts
        p.x = Math.random() * W;
        p.y = H * 0.6 + Math.random() * H * 0.4;
        p.vx = (Math.random() - 0.5) * 0.5;
        p.vy = -0.2 - Math.random() * 0.3;
        p.size = 1 + Math.random() * 2;
        break;

      case 'regen': // naar beneden, snel
        p.x = Math.random() * W;
        p.y = -10;
        p.vx = (Math.random() - 0.5) * 0.5;
        p.vy = 3 + Math.random() * 4;
        p.size = 0.5 + Math.random();
        p.decay = 0.005;
        break;

      case 'water': // druppels + stroom
        p.x = cx + (Math.random() - 0.5) * W * 0.6;
        p.y = -10;
        p.vx = (Math.random() - 0.5) * 0.3;
        p.vy = 1 + Math.random() * 2;
        p.size = 1 + Math.random() * 3;
        p.decay = 0.002;
        break;

      case 'wind': // horizontaal, snel, wervelend
        p.x = -10;
        p.y = Math.random() * H;
        p.vx = 2 + Math.random() * 3;
        p.vy = (Math.random() - 0.5) * 1;
        p.size = 0.5 + Math.random() * 1.5;
        p.decay = 0.003;
        break;
    }

    return p;
  }

  const elementColors = {
    schelp: '124, 110, 245',
    zee:    '100, 140, 220',
    regen:  '142, 202, 230',
    water:  '100, 180, 255',
    wind:   '160, 160, 200',
  };

  const elementSubs = {
    schelp: 'schelp op oor — zee',
    zee:    'golven + schuim + wind',
    regen:  'druppels — snel + hoog',
    water:  'stroom + druppel',
    wind:   'sweep + zuigend',
  };

  let spawnTimer = 0;
  let speedMultiplier = 1;

  function draw() {
    // Fade = continue laag (geen clearRect = oude deeltjes vervaagd)
    ctx.fillStyle = `rgba(6, 6, 10, ${fadeAlpha})`;
    ctx.fillRect(0, 0, W, H);

    time += 0.016;

    // Spawn nieuwe deeltjes
    spawnTimer++;
    const spawnRate = { schelp: 8, zee: 12, regen: 25, water: 15, wind: 20 };
    const rate = Math.max(1, Math.round((spawnRate[currentElement] || 10) / speedMultiplier));
    if (spawnTimer % rate === 0) {
      spawnParticles(3, currentElement);
    }

    // Update + draw deeltjes
    const color = elementColors[currentElement];
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      p.x += p.vx * speedMultiplier;
      p.y += p.vy * speedMultiplier;
      p.life -= p.decay;

      const r = Math.max(0, p.size * p.life);
      if (r <= 0) return;

      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${color}, ${Math.max(0, p.life) * 0.5})`;
      ctx.fill();
    });

    // Center element visuals
    if (currentElement === 'schelp') {
      // Schelp = cirkel met spiraal (nautilus)
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 8; a += 0.1) {
        const r = 10 + a * 8 + Math.sin(time + a) * 5;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (a === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(${color}, ${0.1 + Math.sin(time * 0.5) * 0.05})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (currentElement === 'zee') {
      // Zee = golven onderaan
      for (let g = 0; g < 3; g++) {
        ctx.beginPath();
        for (let x = 0; x < W; x += 5) {
          const nx = x / W;
          const wave = Math.sin(nx * Math.PI * 6 + time * 0.3 + g) * (20 + g * 10);
          const y = H * 0.7 + g * 30 + wave;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = `rgba(${color}, ${0.15 - g * 0.04})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    if (currentElement === 'wind') {
      // Wind = lijnen horizontaal
      for (let l = 0; l < 5; l++) {
        const yBase = H * 0.2 + l * H * 0.12;
        ctx.beginPath();
        for (let x = 0; x < W; x += 3) {
          const wave = Math.sin(x * 0.01 + time * 0.8 + l) * 15;
          const y = yBase + wave;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = `rgba(${color}, ${0.05 + Math.sin(time + l) * 0.03})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    requestAnimationFrame(draw);
  }

  // ── UI ──
  const elLabel = document.getElementById('el-label');
  const elSub = document.getElementById('el-sub');

  document.querySelectorAll('[data-e]').forEach(btn => {
    btn.addEventListener('click', () => {
      initAudio();
      setElement(btn.dataset.e);
      elLabel.textContent = btn.dataset.e;
      elSub.textContent = elementSubs[btn.dataset.e];
      document.querySelectorAll('[data-e]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Reset particles
      particles = [];
    });
  });

  document.querySelectorAll('[data-s]').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = parseFloat(btn.dataset.s);
      speedMultiplier = s;
      document.querySelectorAll('[data-s]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // Start
  draw();
</script>
</body>
</html>
