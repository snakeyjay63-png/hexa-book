<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>• Zee — Plasma Core × IJspolen</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #06060a; color: #e0e0e0;
      font-family: 'IBM Plex Mono', monospace;
      overflow: hidden; cursor: crosshair;
    }
    canvas { display: block; }

    .ui {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 10;
    }
    .element-label { font-size: 1.4em; color: #7c6ef5; margin-bottom: 4px; }
    .element-sub { font-size: 0.7em; color: #666; margin-bottom: 12px; }

    .stone-btn {
      margin-top: 10px;
      background: rgba(100,140,200,0.08); border: 1px solid rgba(100,140,200,0.2);
      color: #8ab4f8; padding: 8px 20px; border-radius: 20px; cursor: pointer;
      font-family: inherit; font-size: 0.85em; transition: all 0.5s;
    }
    .stone-btn:hover { background: rgba(100,140,200,0.15); }
    .stone-btn.rippled {
      background: rgba(100,140,200,0.25);
      border-color: rgba(100,140,200,0.5);
      box-shadow: 0 0 20px rgba(100,140,200,0.1);
    }

    .back-link {
      position: fixed; top: 20px; left: 20px; color: #555; text-decoration: none;
      font-size: 0.8em; z-index: 10; transition: color 0.3s;
    }
    .back-link:hover { color: #7c6ef5; }

    .info {
      position: fixed; top: 20px; right: 20px; color: #444; font-size: 0.65em;
      text-align: right; z-index: 10;
    }

    .mode-toggle {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; z-index: 10;
    }
    .mode-btn {
      background: rgba(124,110,245,0.05); border: 1px solid rgba(124,110,245,0.1);
      color: #555; padding: 4px 10px; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 0.6em; transition: all 0.3s;
    }
    .mode-btn:hover { background: rgba(124,110,245,0.1); }
    .mode-btn.active { background: rgba(124,110,245,0.15); color: #c0b8e8; border-color: rgba(124,110,245,0.3); }
  </style>
</head>
<body>
  <a href="bit.html" class="back-link">← bit</a>
  <a href="index.html" class="back-link" style="top:50px;">← hexa-book</a>
  <div class="info" id="info">plasma core — stil</div>

  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="all">alle lagen</button>
    <button class="mode-btn" data-mode="core">plasma core</button>
    <button class="mode-btn" data-mode="aarde">aarde</button>
    <button class="mode-btn" data-mode="water">water + E/M</button>
    <button class="mode-btn" data-mode="air">lucht</button>
    <button class="mode-btn" data-mode="ice">ijspolen</button>
    <button class="mode-btn active" data-mode="cycle">watercyclus</button>
  </div>

  <div style="position:fixed;bottom:130px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;">
    <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:4px;">
      <label style="color:#555;font-size:0.6em;">aarde rotatie:</label>
      <input type="range" id="earthSpeed" min="0.2" max="3" step="0.1" value="1" style="width:100px;opacity:0.5;">
      <span id="earthSpeedVal" style="color:#8a9abf;font-size:0.55em;">1.0×</span>
    </div>
    <div id="balanceDisplay" style="color:#7c6ef5;font-size:0.6em;">
      maan orbit: 1× → core: 1.00× → balans 1=0
    </div>
  </div>

  <canvas id="c"></canvas>

  <div class="ui" id="ui">
    <div class="element-label">zee</div>
    <div class="element-sub" id="el-sub">plasma core (druk↔) → aarde → E/M → water → lucht (L/H druk → wind) → wolken → ijs</div>
    <button class="stone-btn" id="stone-btn">● steen gooien</button>
  </div>

<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const infoEl = document.getElementById('info');
  const elSub = document.getElementById('el-sub');
  const stoneBtn = document.getElementById('stone-btn');

  let W, H, cx, cy, R;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
    R = Math.min(W, H) * 0.35;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Laagstructuur (binnen → buiten) ──
  //
  // 1. Plasma Core (0-15% R)
  //    = druk van water → beweging → plasma → E/M veld
  //    = circulaire lus: druk ↔ beweging ↔ E/M ↔ druk
  //    = zonder druk = geen core, zonder core = geen water
  //    = rood/oranje, fel, warm
  //
  // 2. Aarde / Sediment (15-30% R)
  //    = wat overblijft als water verdampt
  //    = zand = verdampt water wat naar beneden zakt
  //    = leven hier, maar wordt gemaakt door water
  //    = Mars heeft dit ook, alleen onder zand (niet zichtbaar)
  //    = bruin, aarde, sediment
  //
  // 3. E/M Veld Zone (30-40% R)
  //    = het veld dat het water vasthoudt
  //    = ioniserende straling, paars/blauw
  //    = op Mars zit dit ONDER het zand (zelfde patroon, niet zichtbaar)
  //
  // 4. Water Laag (40-65% R)
  //    = de zee zelf, vastgehouden door E/M veld
  //    = blauw, golven, leven
  //    = bovenste laag verdampt → rest zakt naar beneden → sediment
  //
  // 5a. Vochtige Lucht (65-80% R)
  //    = atmosfeer met waterdamp
  //    = condensatie, wolken, regen
  //
  // 5b. Droge Lucht (80-90% R)
  //    = atmosfeer ZONDER water meer
  //    = het punt waar lucht geen water meer bevat
  //
  // 6. IJspolen (buiten 90% R, alleen boven/onder)
  //    = ijs alleen op noord + zuid pool
  //    = wit, koud, de muur

  let viewMode = 'all';
  let time = 0;
  let earthRotationMult = 1;
  let moonOrbitSpeed = 1;      // basis: maan orbit als referentie
  let coreSpeed = 1;            // berekend: core snelheid voor balans 1=0
  let audioOn = false;
  let rippleTime = 0;
  let stones = [];

  // ── Audio ──
  let audioCtx = null;
  let audioNodes = null;

  function initAudio() {
    if (audioCtx) return true;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const bufSize = audioCtx.sampleRate * 4;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buf; noise.loop = true;

    const bp1 = audioCtx.createBiquadFilter();
    bp1.type = 'bandpass'; bp1.frequency.value = 400; bp1.Q.value = 0.5;
    const bp2 = audioCtx.createBiquadFilter();
    bp2.type = 'bandpass'; bp2.frequency.value = 400; bp2.Q.value = 0.5;

    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.15;
    lfoGain.gain.value = 200;
    lfo.connect(lfoGain);
    lfoGain.connect(bp1.frequency);
    lfo.start();

    const master = audioCtx.createGain();
    master.gain.value = 0;

    noise.connect(bp1); noise.connect(bp2);
    bp1.connect(master); bp2.connect(master);
    master.connect(audioCtx.destination);
    noise.start();

    audioNodes = { noise, bp1, bp2, lfo, lfoGain, master };
    return true;
  }

  function setAudio(on) {
    if (!audioNodes) return;
    const t = 1;
    const n = audioNodes;
    if (on) {
      // Plasma core = lage frequentie + trillende hoge
      n.bp1.frequency.setTargetAtTime(100, audioCtx.currentTime, t);
      n.bp1.Q.setTargetAtTime(1, audioCtx.currentTime, t);
      n.bp2.frequency.setTargetAtTime(3000, audioCtx.currentTime, t);
      n.bp2.Q.setTargetAtTime(4, audioCtx.currentTime, t);
      n.lfo.frequency.setTargetAtTime(0.03, audioCtx.currentTime, t);
      n.lfoGain.gain.setTargetAtTime(200, audioCtx.currentTime, t);
      n.master.gain.setTargetAtTime(0.06, audioCtx.currentTime, t);
    } else {
      n.master.gain.setTargetAtTime(0, audioCtx.currentTime, t);
    }
  }

  // ── Golven (in water laag) ──
  function getWaveHeight(px, py, t) {
    let h = 0;
    for (let si = 0; si < stones.length; si++) {
      const s = stones[si];
      const age = t - s.time;
      const speed = 60;

      const dx = px - s.x;
      const dy = py - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const ringDist = age * speed;
      const ringWidth = 30 + age * 10;

      if (Math.abs(dist - ringDist) < ringWidth) {
        const ripple = Math.sin((dist - ringDist) * 0.1) *
                       Math.exp(-age * 0.04) *
                       Math.exp(-Math.abs(dist - ringDist) / ringWidth);
        h += ripple * 15;
      }

      // Reflectie van ijsrand (in water zone)
      const sDx = s.x - cx;
      const sDy = s.y - cy;
      const sDist = Math.sqrt(sDx * sDx + sDy * sDy);
      if (sDist < R * 0.7) {
        const mirrorDist = 2 * R * 0.7 - sDist;
        const mirrorAngle = Math.atan2(sDy, sDx);
        const mx = cx + mirrorDist * Math.cos(mirrorAngle);
        const my = cy + mirrorDist * Math.sin(mirrorAngle);

        const rdx = px - mx;
        const rdy = py - my;
        const rDist = Math.sqrt(rdx * rdx + rdy * rdy);
        const rRingDist = (age + sDist / speed) * speed;

        if (Math.abs(rDist - rRingDist) < ringWidth) {
          const rRipple = Math.sin((rDist - rRingDist) * 0.1) *
                          Math.exp(-age * 0.04) *
                          Math.exp(-Math.abs(rDist - rRingDist) / ringWidth);
          h += rRipple * 10;
        }
      }
    }
    return h;
  }

  // ── Lagen ──
  const LAYERS = {
    core:     { inner: 0,   outer: 0.15 },
    aarde:    { inner: 0.15, outer: 0.30 },
    em:       { inner: 0.30, outer: 0.40 },
    water:    { inner: 0.40, outer: 0.65 },
    airVocht: { inner: 0.65, outer: 0.80 },
    airDroog: { inner: 0.80, outer: 0.90 },
    ice:      { inner: 0.90, outer: 1.0 },
  };

  function showLayer(name) {
    if (viewMode === 'all') return true;
    return viewMode === name || (name === 'airVocht' && viewMode === 'air') || (name === 'airDroog' && viewMode === 'air');
  }

  // ── Plasma Core + Zwart Gat ──
  function drawPlasmaCore() {
    if (!showLayer('core')) return;

    const r = R * LAYERS.core.outer;

    // Core glow
    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    coreGrad.addColorStop(0, 'rgba(255,100,30,0.9)');
    coreGrad.addColorStop(0.5, 'rgba(255,60,20,0.5)');
    coreGrad.addColorStop(1, 'rgba(255,30,10,0.1)');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = coreGrad;
    ctx.fill();

    // Plasma beweging (volgt coreSpeed)
    const plasmaLines = 6;
    for (let i = 0; i < plasmaLines; i++) {
      const angle = (i / plasmaLines) * Math.PI * 2 + time * 0.5 * coreSpeed;
      const innerR = r * 0.2;
      const outerR = r * 0.9;

      ctx.beginPath();
      for (let t = 0; t <= 1; t += 0.02) {
        const cr = innerR + (outerR - innerR) * t;
        const a = angle + Math.sin(t * 5 + time * 2) * 0.3;
        const px = cx + Math.cos(a) * cr;
        const py = cy + Math.sin(a) * cr;
        if (t === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = `rgba(255,150,50,${0.5 + Math.sin(time * 3 + i) * 0.1})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Druk feedback lijnen (core ↔ water, volgt coreSpeed)
    const feedbackLines = 4;
    for (let i = 0; i < feedbackLines; i++) {
      const angle = (i / feedbackLines) * Math.PI * 2 + time * 0.2 * coreSpeed;
      const pulse = Math.sin(time * 1.5 + i) * 0.15;

      ctx.beginPath();
      ctx.moveTo(
        cx + Math.cos(angle) * r,
        cy + Math.sin(angle) * r
      );
      ctx.lineTo(
        cx + Math.cos(angle + pulse) * R * LAYERS.aarde.inner,
        cy + Math.sin(angle + pulse) * R * LAYERS.aarde.inner
      );
      ctx.strokeStyle = `rgba(255,120,40,${0.1 + Math.sin(time * 2 + i) * 0.05})`;
      ctx.lineWidth = 0.5;
      ctx.setLineDash([3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // ── Zwart Gat (centrum) ──
    const holeR = r * 0.25;

    // Schwarzschild radius (zwart gat)
    const holeGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, holeR);
    holeGrad.addColorStop(0, 'rgba(0,0,0,1)');
    holeGrad.addColorStop(0.6, 'rgba(0,0,0,0.8)');
    holeGrad.addColorStop(1, 'rgba(10,5,0,0.3)');
    ctx.beginPath();
    ctx.arc(cx, cy, holeR, 0, Math.PI * 2);
    ctx.fillStyle = holeGrad;
    ctx.fill();

    // Geval licht (accretion disk)
    ctx.beginPath();
    ctx.arc(cx, cy, holeR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,100,30,${0.4 + Math.sin(time * 3) * 0.1})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Accretion ring (dun, pulserend)
    for (let a = 0; a < 6; a++) {
      const aAngle = (a / 6) * Math.PI * 2 + time * 0.5 * coreSpeed;
      const aInner = holeR + 2;
      const aOuter = holeR + 6 + Math.sin(time * 4 + a) * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(aAngle) * aInner, cy + Math.sin(aAngle) * aInner);
      ctx.lineTo(cx + Math.cos(aAngle) * aOuter, cy + Math.sin(aAngle) * aOuter);
      ctx.strokeStyle = `rgba(255,150,50,${0.15 + Math.sin(time * 2 + a) * 0.05})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Label
    ctx.fillStyle = 'rgba(255,100,30,0.5)';
    ctx.font = '0.3em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('zwart gat', cx, cy);

    // Plasma core label buiten het zwart gat
    ctx.fillStyle = 'rgba(255,150,50,0.4)';
    ctx.font = '0.35em "IBM Plex Mono", monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('plasma', cx, cy + r + 12);
    ctx.fillText('core', cx, cy + r + 24);
    ctx.font = '0.25em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(255,120,40,0.25)';
    ctx.fillText('druk ↔ beweging', cx, cy + r + 36);
  }

  // ── Core ↔ Druk Feedback Lus (visueel) ──
  // Circulaire relatie: core druk → water beweging → E/M veld → terug naar core
  function drawFeedbackLoop() {
    if (viewMode !== 'all') return;

    const coreR = R * LAYERS.core.outer;
    const waterR = R * (LAYERS.water.inner + LAYERS.water.outer) / 2;
    const emR = R * (LAYERS.em.inner + LAYERS.em.outer) / 2;

    // 3 punten van de feedback lus (driehoekig patroon)
    const points = [
      { r: coreR, angle: Math.PI * 0.1, label: 'core', color: '255,100,30' },
      { r: waterR, angle: Math.PI * 0.9, label: 'water', color: '60,120,200' },
      { r: emR, angle: Math.PI * 1.3, label: 'E/M', color: '160,100,255' },
    ];

    // Pijlen tussen de punten (cirkelvormig)
    for (let i = 0; i < points.length; i++) {
      const from = points[i];
      const to = points[(i + 1) % points.length];

      const fx = cx + Math.cos(from.angle) * from.r;
      const fy = cy + Math.sin(from.angle) * from.r;
      const tx = cx + Math.cos(to.angle) * to.r;
      const ty = cy + Math.sin(to.angle) * to.r;

      // Gebogen pijl
      const steps = 20;
      ctx.beginPath();
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        let x = fx + (tx - fx) * t;
        let y = fy + (ty - fy) * t;

        // Buiging naar buiten (boog)
        const midX = (fx + tx) / 2;
        const midY = (fy + ty) / 2;
        const perpX = -(ty - fy);
        const perpY = (tx - fx);
        const perpLen = Math.sqrt(perpX * perpX + perpY * perpY) || 1;
        const bend = Math.sin(t * Math.PI) * 10;
        x += (perpX / perpLen) * bend;
        y += (perpY / perpLen) * bend;

        if (s === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      const pulse = 0.06 + Math.sin(time * 2 + i) * 0.02;
      ctx.strokeStyle = `rgba(${from.color},${pulse})`;
      ctx.lineWidth = 0.8;
      ctx.setLineDash([3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Pijlkop bij doel
      const arrowSize = 3;
      ctx.beginPath();
      ctx.arc(tx, ty, arrowSize, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${to.color},${pulse * 2})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Label voor feedback lus
    ctx.fillStyle = 'rgba(180,160,200,0.1)';
    ctx.font = '0.20em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('core ↔ druk ↔ beweging ↔ E/M (lus)', cx, cy + R * 0.55);
  }

  // ── Aarde / Sediment ──
  function drawAardeLayer() {
    if (!showLayer('aarde')) return;

    const inner = R * LAYERS.aarde.inner;
    const outer = R * LAYERS.aarde.outer;

    // Sediment zone
    const aGrad = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    aGrad.addColorStop(0, 'rgba(140,100,60,0.25)');
    aGrad.addColorStop(0.5, 'rgba(120,90,50,0.2)');
    aGrad.addColorStop(1, 'rgba(100,80,40,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.arc(cx, cy, inner, 0, Math.PI * 2, true);
    ctx.fillStyle = aGrad;
    ctx.fill();

    // Sediment korrels (rotatie)
    const grains = 30;
    for (let i = 0; i < grains; i++) {
      const angle = (i / grains) * Math.PI * 2;
      const grainR = inner + (outer - inner) * ((i % 5) / 5);
      const px = cx + Math.cos(angle + time * 0.05 * earthRotationMult) * grainR;
      const py = cy + Math.sin(angle + time * 0.05 * earthRotationMult) * grainR;
      const size = 1 + Math.sin(time + i) * 0.5;

      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(160,120,70,${0.12 + Math.sin(time * 0.5 + i) * 0.02})`;
      ctx.fill();
    }

    // Sedimentatie deeltjes (zakken van water → sediment)
    // Deeltjes beginnen bij binnenkant water en zakken naar sediment laag
    const sedimentParticles = 12;
    for (let i = 0; i < sedimentParticles; i++) {
      const angle = (i / sedimentParticles) * Math.PI * 2 + time * 0.02;
      const fallProgress = ((time * 0.15 + i / sedimentParticles) % 1);
      const fallY = R * LAYERS.water.inner + (outer - R * LAYERS.water.inner) * fallProgress;
      const px = cx + Math.cos(angle) * fallY;
      const py = cy + Math.sin(angle) * fallY;
      const size = 0.5 + (1 - fallProgress) * 0.8;
      const alpha = (1 - fallProgress) * 0.2;

      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(160,120,70,${alpha})`;
      ctx.fill();
    }

    // Label
    const labelR = (inner + outer) / 2;
    ctx.fillStyle = 'rgba(160,120,70,0.3)';
    ctx.font = '0.35em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('aarde', cx - labelR * 0.5, cy - labelR);
    ctx.font = '0.25em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(160,120,70,0.15)';
    ctx.fillText('(water → verdampt → rest zakt)', cx - labelR * 0.5, cy - labelR + 10);
  }

  // ── E/M Veld ──
  function drawEMField() {
    if (!showLayer('em')) return;

    const inner = R * LAYERS.em.inner;
    const outer = R * LAYERS.em.outer;

    // Jupiter invloed op EM veld
    let jupiterPulse = 0;
    if (showPlanets) {
      const jup = PLANETS.find(p => p.name === 'jupiter');
      if (jup) {
        const jAngle = time * jup.speed + jup.phase;
        jupiterPulse = COSMIC_INFLUENCE['jupiter'].strength * (0.5 + Math.sin(jAngle) * 0.5) * 0.1;
      }
    }

    // EM zone
    const emGrad = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    emGrad.addColorStop(0, 'rgba(100,50,200,0)');
    emGrad.addColorStop(0.3, `rgba(100,50,200,${0.12 + jupiterPulse})`);
    emGrad.addColorStop(0.7, `rgba(80,40,180,${0.15 + jupiterPulse})`);
    emGrad.addColorStop(1, 'rgba(60,30,160,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.arc(cx, cy, inner, 0, Math.PI * 2, true);
    ctx.fillStyle = emGrad;
    ctx.fill();

    // Veld lijnen
    const fieldLines = 12;
    for (let i = 0; i < fieldLines; i++) {
      const baseAngle = (i / fieldLines) * Math.PI * 2;

      ctx.beginPath();
      for (let t = 0; t <= 1; t += 0.01) {
        const r = inner + (outer - inner) * t;
        const wave = Math.sin(t * 8 + time * 2 * coreSpeed) * (outer - inner) * 0.1;
        const a = baseAngle + wave / r;
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        if (t === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = `rgba(120,80,220,${0.25 + Math.sin(time + i) * 0.03})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Label
    const labelR = (inner + outer) / 2;
    ctx.fillStyle = 'rgba(120,80,220,0.25)';
    ctx.font = '0.35em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('E/M veld', cx + Math.cos(time * 0.1) * labelR * 0.3, cy - labelR);
    ctx.font = '0.25em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(120,80,220,0.06)';
    ctx.fillText('(Mars: onder zand, zelfde patroon)', cx + Math.cos(time * 0.1) * labelR * 0.3, cy - labelR + 10);
  }

  // ── Water Laag (+ getijden vervorming) ──
  function drawWaterLayer() {
    if (!showLayer('water')) return;

    const inner = R * LAYERS.water.inner;
    const outer = R * LAYERS.water.outer;

    // Getijden: maan veroorzaakt dubbele bol (naar maan + tegenovergesteld)
    let moonAngle = 0;
    let tidalAmplitude = 0;
    if (showPlanets) {
      const maan = PLANETS.find(p => p.name === 'maan');
      if (maan) {
        moonAngle = time * maan.speed + maan.phase;
        const tidalInf = COSMIC_INFLUENCE['maan'];
        tidalAmplitude = (tidalInf ? tidalInf.strength : 0.7) * 8; // max 8px vervorming
      }
    }

    // Kosmische invloed op water
    let cosmicPulse = 0;
    if (showPlanets) {
      PLANETS.forEach((pl, pi) => {
        const inf = COSMIC_INFLUENCE[pl.name];
        if (inf && inf.layer === 'water') {
          const pAngle = time * pl.speed + pl.phase;
          const dist = Math.cos(pAngle - Math.PI * 0.5);
          cosmicPulse += inf.strength * (0.5 + dist * 0.5) * 0.1;
        }
      });
      cosmicPulse = Math.min(cosmicPulse, 0.3);
    }

    // Water zone (met getijden vervorming aan buitenrand)
    const wGrad = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    wGrad.addColorStop(0, `rgba(30,80,150,${0.35 + cosmicPulse})`);
    wGrad.addColorStop(0.5, `rgba(20,50,120,${0.25 + cosmicPulse * 0.5})`);
    wGrad.addColorStop(1, `rgba(40,80,160,${0.15 + cosmicPulse * 0.3})`);
    ctx.beginPath();

    // Getijden vervorming: dubbele bol (2*Math.cos(2*theta) = bol bij maan + tegenover)
    const tidalSteps = 120;
    for (let i = 0; i <= tidalSteps; i++) {
      const angle = (i / tidalSteps) * Math.PI * 2;
      const thetaDiff = angle - moonAngle;
      const tidalBulge = Math.cos(2 * thetaDiff) * tidalAmplitude;
      const r = outer + tidalBulge;
      const px = cx + Math.cos(angle) * r;
      const py = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();

    // Inner ring (normaal, niet vervormd)
    ctx.arc(cx, cy, inner, 0, Math.PI * 2, true);
    ctx.fillStyle = wGrad;
    ctx.fill();

    // Golven (altijd subtiele golven, feller met steen)
    const step = 4;
    for (let y = cy - outer; y < cy + outer; y += step) {
      const rowDy = y - cy;
      const rowHW = Math.sqrt(Math.max(0, outer * outer - rowDy * rowDy));

      // Alleen in water zone
      const minDist = Math.max(rowDy, inner);
      if (minDist > outer) continue;

      let waveAlpha = 0;
      if (audioOn && stones.length > 0) {
        const h = getWaveHeight(cx, y, time);
        waveAlpha = Math.abs(h) * 0.005;
      }

      ctx.beginPath();
      const startX = cx - Math.min(rowHW, outer);
      ctx.moveTo(startX, y);
      ctx.lineTo(cx + Math.min(rowHW, outer), y);
      const alpha = (audioOn ? 0.04 : 0.02) + waveAlpha;
      ctx.strokeStyle = `rgba(100,150,200,${alpha})`;
      ctx.lineWidth = step * 0.3;
      ctx.stroke();
    }

    // Concentrische ringen
    const rings = 8;
    for (let ri = 0; ri <= rings; ri++) {
      const ringR = inner + (outer - inner) * (ri / rings);
      ctx.beginPath();
      ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(80,120,180,0.15)`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // ── Getijden markers ──
    if (showPlanets && tidalAmplitude > 0) {
      // Hoogwater (naar maan)
      const hwR = outer + tidalAmplitude;
      const hwX = cx + Math.cos(moonAngle) * hwR;
      const hwY = cy + Math.sin(moonAngle) * hwR;
      ctx.beginPath();
      ctx.arc(hwX, hwY, 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(80,160,200,0.25)';
      ctx.fill();
      ctx.fillStyle = 'rgba(80,160,200,0.2)';
      ctx.font = '0.22em "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('hoogwater ↑', hwX, hwY + 10);

      // Hoogwater (tegenover maan)
      const hw2Angle = moonAngle + Math.PI;
      const hw2X = cx + Math.cos(hw2Angle) * hwR;
      const hw2Y = cy + Math.sin(hw2Angle) * hwR;
      ctx.beginPath();
      ctx.arc(hw2X, hw2Y, 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(80,160,200,0.25)';
      ctx.fill();
      ctx.fillStyle = 'rgba(80,160,200,0.2)';
      ctx.fillText('hoogwater ↑', hw2X, hw2Y + 10);

      // Laagwater (tussen de bollen in, 90° verschoven)
      const lwAngle1 = moonAngle + Math.PI * 0.5;
      const lwAngle2 = moonAngle - Math.PI * 0.5;
      const lwR = outer - tidalAmplitude * 0.6;
      [lwAngle1, lwAngle2].forEach(lwA => {
        const lwX = cx + Math.cos(lwA) * lwR;
        const lwY = cy + Math.sin(lwA) * lwR;
        ctx.beginPath();
        ctx.arc(lwX, lwY, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180,200,100,0.15)';
        ctx.fill();
        ctx.fillStyle = 'rgba(180,200,100,0.12)';
        ctx.font = '0.20em "IBM Plex Mono", monospace';
        ctx.fillText('laagwater ↓', lwX, lwY + 8);
      });

      // Getijden label
      ctx.fillStyle = 'rgba(80,160,200,0.12)';
      ctx.font = '0.22em "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('getijden = maan trekkracht (dubbele bol)', cx, cy + outer + tidalAmplitude + 22);
    }

    // Verdampings indicator (volgt zonpositie — waar zon schijnt = verdamping)
    let evapAngle = Math.PI * 0.1; // default
    if (showPlanets) {
      const zon = PLANETS.find(p => p.name === 'zon');
      if (zon) evapAngle = time * zon.speed + zon.phase;
    }
    const evapX = cx + Math.cos(evapAngle) * (outer - 4);
    const evapY = cy + Math.sin(evapAngle) * (outer - 4);
    ctx.beginPath();
    ctx.arc(cx, cy, outer, evapAngle - 0.3, evapAngle + 0.3);
    ctx.strokeStyle = `rgba(100,150,200,${0.1 + Math.sin(time * 2) * 0.03})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Verdamping pijltje ↑ (volgt zon)
    const evapPulse = 0.08 + Math.sin(time * 1.5) * 0.03;
    ctx.beginPath();
    ctx.moveTo(evapX, evapY);
    const evapOut = evapX + Math.cos(evapAngle) * 15;
    const evapOutY = evapY + Math.sin(evapAngle) * 15;
    ctx.lineTo(evapOut, evapOutY);
    ctx.strokeStyle = `rgba(255,200,80,${evapPulse})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Zon-gerichte label
    ctx.fillStyle = 'rgba(255,200,80,0.15)';
    ctx.font = '0.2em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('verdamping ↑ (zon)', evapOut + Math.cos(evapAngle) * 10, evapOutY + Math.sin(evapAngle) * 10);

    // ── Watercyclus pijlen (volgt drukveld + zon) ──
    if (showCycle) {
      // Verdamping volgt zonpositie
      let cycleEvapAngle = evapAngle;
      const evapStartR = (LAYERS.water.inner + LAYERS.water.outer) / 2;
      const evapEndR = (LAYERS.airVocht.inner + LAYERS.airVocht.outer) / 2;
      drawCycleArrow(
        cx + Math.cos(cycleEvapAngle) * R * evapStartR,
        cy + Math.sin(cycleEvapAngle) * R * evapStartR,
        cx + Math.cos(cycleEvapAngle) * R * evapEndR,
        cy + Math.sin(cycleEvapAngle) * R * evapEndR,
        'rgba(255,200,80,0.12)', 'verdamping (zon↑)'
      );

      // Regen volgt laag druk (condensatie → water)
      const rainAngle = cycleEvapAngle + Math.PI * 0.15; // iets verschoven
      drawCycleArrow(
        cx + Math.cos(rainAngle) * R * evapEndR,
        cy + Math.sin(rainAngle) * R * evapEndR,
        cx + Math.cos(rainAngle) * R * evapStartR,
        cy + Math.sin(rainAngle) * R * evapStartR,
        'rgba(120,160,200,0.10)', 'regen (druk↓)'
      );

      // Bevriezing: water → poolijs
      drawCycleArrow(
        cx + R * 0.50, cy - R * 0.45,
        cx + R * 0.10, cy - R * 0.92,
        'rgba(180,210,240,0.08)', 'bevriezing'
      );

      // Sedimentatie: water ↓ → aarde
      drawCycleArrow(
        cx - R * 0.50, cy + R * 0.50,
        cx - R * 0.30, cy + R * 0.25,
        'rgba(160,120,70,0.10)', 'sediment'
      );
    }

    // Label
    const labelR = (inner + outer) / 2;
    ctx.fillStyle = 'rgba(100,150,200,0.1)';
    ctx.font = '0.35em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('water', cx, cy + labelR);
    ctx.font = '0.25em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(100,150,200,0.06)';
    ctx.fillText('(bovenkant verdampt → rest zakt → aarde)', cx, cy + labelR + 10);
  }

  // ── Helper: watercyclus pijl ──
  function drawCycleArrow(x1, y1, x2, y2, color, label) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;

    // Gebogen lijn
    const steps = 12;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      let x = x1 + dx * t;
      let y = y1 + dy * t;

      // Buiging
      const perpX = -dy / dist;
      const perpY = dx / dist;
      const bend = Math.sin(t * Math.PI) * 8;
      x += perpX * bend;
      y += perpY * bend;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    // Pulse effect - pulse alpha channel
    const pulse = 0.7 + Math.sin(time * 2) * 0.3;
    const rgbaMatch = color.match(/^rgba?\((\d+),(\d+),(\d+),?(\d*\.?\d*)?\)$/);
    if (rgbaMatch) {
      const [, r, g, b, aStr] = rgbaMatch;
      const a = ((aStr ? parseFloat(aStr) : 1) * pulse).toFixed(3);
      ctx.strokeStyle = `rgba(${r},${g},${b},${a})`;
    } else {
      ctx.strokeStyle = color;
    }
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Pijlkop
    const arrowAngle = Math.atan2(dy, dx);
    const arrowSize = 4;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(
      x2 - arrowSize * Math.cos(arrowAngle - 0.4),
      y2 - arrowSize * Math.sin(arrowAngle - 0.4)
    );
    ctx.moveTo(x2, y2);
    ctx.lineTo(
      x2 - arrowSize * Math.cos(arrowAngle + 0.4),
      y2 - arrowSize * Math.sin(arrowAngle + 0.4)
    );
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Label
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    ctx.fillStyle = color;
    ctx.font = '0.20em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, midX + 12, midY - 4);
  }

  // ── Drukgebieden + Wind + Wolken ──
  // Druk = mechanisch (niet E/M)
  // Laag druk = warmte ↑ → verdamping → vochtige lucht stijgt
  // Hoog druk = koeling ↓ → droge lucht daalt
  // Wind = hoogdruk → laagdruk (drukverschil)
  // Wolken = volgt laag druk (condensatie zone)
  function drawPressureSystem() {
    if (!showLayer('airVocht') && !showLayer('airDroog')) return;

    const airInner = R * LAYERS.airVocht.inner;
    const airOuter = R * LAYERS.airDroog.outer;

    // Zon positie beïnvloedt druk (zon = warmte = laag druk)
    let sunAngle = 0;
    if (showPlanets) {
      const zon = PLANETS.find(p => p.name === 'zon');
      if (zon) sunAngle = time * zon.speed + zon.phase;
    }

    // Laag druk volgt zon (warmte → verdamping ↑)
    const lowPressAngle = sunAngle;
    const lowPressR = (airInner + airOuter) / 2;
    const lowPressX = cx + Math.cos(lowPressAngle) * lowPressR;
    const lowPressY = cy + Math.sin(lowPressAngle) * lowPressR;

    // Hoog druk tegenovergesteld
    const highPressAngle = sunAngle + Math.PI;
    const highPressX = cx + Math.cos(highPressAngle) * lowPressR;
    const highPressY = cy + Math.sin(highPressAngle) * lowPressR;

    // ── Laag druk zone (L) ──
    const lpGrad = ctx.createRadialGradient(lowPressX, lowPressY, 0, lowPressX, lowPressY, airOuter * 0.35);
    lpGrad.addColorStop(0, 'rgba(180,140,100,0.12)');
    lpGrad.addColorStop(0.5, 'rgba(180,140,100,0.05)');
    lpGrad.addColorStop(1, 'rgba(180,140,100,0)');
    ctx.beginPath();
    ctx.arc(lowPressX, lowPressY, airOuter * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = lpGrad;
    ctx.fill();

    // L label
    ctx.fillStyle = 'rgba(180,140,100,0.3)';
    ctx.font = '0.35em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('L', lowPressX, lowPressY + 4);
    ctx.font = '0.2em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(180,140,100,0.15)';
    ctx.fillText('(warmte↑ verdamping)', lowPressX, lowPressY + 14);

    // ── Hoog druk zone (H) ──
    const hpGrad = ctx.createRadialGradient(highPressX, highPressY, 0, highPressX, highPressY, airOuter * 0.35);
    hpGrad.addColorStop(0, 'rgba(100,140,180,0.12)');
    hpGrad.addColorStop(0.5, 'rgba(100,140,180,0.05)');
    hpGrad.addColorStop(1, 'rgba(100,140,180,0)');
    ctx.beginPath();
    ctx.arc(highPressX, highPressY, airOuter * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = hpGrad;
    ctx.fill();

    // H label
    ctx.fillStyle = 'rgba(100,140,180,0.3)';
    ctx.font = '0.35em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('H', highPressX, highPressY + 4);
    ctx.font = '0.2em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(100,140,180,0.15)';
    ctx.fillText('(koeling↓ droog)', highPressX, highPressY + 14);

    // ── Wind pijlen (H → L, circulatie langs drukveld) ──
    // Circulatie: H daalt → oppervlak H→L → L stijgt → hoogte L→H
    const windArrows = 4;
    for (let i = 0; i < windArrows; i++) {
      const t = i / windArrows;
      // Bogen van H naar L (twee kanten)
      const arcAngle1 = highPressAngle + (lowPressAngle - highPressAngle + Math.PI * 2) % (Math.PI * 2) * t;
      const arcAngle2 = lowPressAngle + (highPressAngle - lowPressAngle + Math.PI * 2) % (Math.PI * 2) * t;

      // Onder: wind van H → L
      const windR1 = (airInner + airOuter) / 2;
      const wx1 = cx + Math.cos(arcAngle1) * windR1;
      const wy1 = cy + Math.sin(arcAngle1) * windR1;

      // Pijltjes langs de circulatie
      const tangentAngle1 = arcAngle1 + Math.PI * 0.5; // tangentieel
      const arrowLen = 12;
      const ax1 = wx1 + Math.cos(tangentAngle1) * arrowLen;
      const ay1 = wy1 + Math.sin(tangentAngle1) * arrowLen;

      ctx.beginPath();
      ctx.moveTo(wx1, wy1);
      ctx.lineTo(ax1, ay1);
      ctx.strokeStyle = `rgba(140,180,200,${0.15 + Math.sin(time * 2 + i) * 0.05})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();

      // Pijlkop
      const aSize = 3;
      ctx.beginPath();
      ctx.moveTo(ax1, ay1);
      ctx.lineTo(ax1 - aSize * Math.cos(tangentAngle1 - 0.4), ay1 - aSize * Math.sin(tangentAngle1 - 0.4));
      ctx.moveTo(ax1, ay1);
      ctx.lineTo(ax1 - aSize * Math.cos(tangentAngle1 + 0.4), ay1 - aSize * Math.sin(tangentAngle1 + 0.4));
      ctx.stroke();

      // Terug: wind van L → H (bovenkant, hogere lucht)
      const windR2 = (airInner + airOuter) / 2 + 5; // iets buiten
      const wx2 = cx + Math.cos(arcAngle2) * windR2;
      const wy2 = cy + Math.sin(arcAngle2) * windR2;
      const tangentAngle2 = arcAngle2 - Math.PI * 0.5;
      const ax2 = wx2 + Math.cos(tangentAngle2) * arrowLen;
      const ay2 = wy2 + Math.sin(tangentAngle2) * arrowLen;

      ctx.beginPath();
      ctx.moveTo(wx2, wy2);
      ctx.lineTo(ax2, ay2);
      ctx.strokeStyle = `rgba(140,180,200,${0.1 + Math.sin(time * 2 + i + 2) * 0.03})`;
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }

    // Wind label
    ctx.fillStyle = 'rgba(140,180,200,0.15)';
    ctx.font = '0.22em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('wind = drukverschil (H→L)', cx, cy + airOuter + 16);

    // ── Wolken volgen laag druk (condensatie zone) ──
    const cloudCount = 12;
    for (let i = 0; i < cloudCount; i++) {
      // Wolken clusteren rond laag druk punt
      const baseAngle = lowPressAngle + (i / cloudCount) * Math.PI * 0.8 - Math.PI * 0.4;
      const cloudR = lowPressR + Math.sin(time * 0.3 + i * 1.7) * (airOuter - airInner) * 0.3;
      const cpx = cx + Math.cos(baseAngle) * cloudR;
      const cpy = cy + Math.sin(baseAngle) * cloudR;
      const cSize = 2 + Math.sin(time + i) * 1;

      // Wolken = condensatie (wit/blauw)
      ctx.beginPath();
      ctx.arc(cpx, cpy, cSize, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,240,${0.12 + Math.sin(time * 0.5 + i) * 0.04})`;
      ctx.fill();

      // Subtiele glow
      const cloudGlow = ctx.createRadialGradient(cpx, cpy, 0, cpx, cpy, cSize * 2);
      cloudGlow.addColorStop(0, `rgba(200,220,240,0.04)`);
      cloudGlow.addColorStop(1, 'rgba(200,220,240,0)');
      ctx.beginPath();
      ctx.arc(cpx, cpy, cSize * 2, 0, Math.PI * 2);
      ctx.fillStyle = cloudGlow;
      ctx.fill();
    }
  }

  // ── Vochtige Lucht ──
  function drawAirVocht() {
    if (!showLayer('airVocht')) return;

    const inner = R * LAYERS.airVocht.inner;
    const outer = R * LAYERS.airVocht.outer;

    // Vochtige zone (lichtblauw met condensatie)
    const aGrad = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    aGrad.addColorStop(0, 'rgba(160,190,220,0)');
    aGrad.addColorStop(0.5, 'rgba(160,190,220,0.08)');
    aGrad.addColorStop(1, 'rgba(160,190,220,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.arc(cx, cy, inner, 0, Math.PI * 2, true);
    ctx.fillStyle = aGrad;
    ctx.fill();

    // Label
    const labelR = (inner + outer) / 2;
    ctx.fillStyle = 'rgba(170,200,220,0.2)';
    ctx.font = '0.3em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('lucht (vochtig)', cx, cy - labelR);
    ctx.font = '0.2em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(170,200,220,0.1)';
    ctx.fillText('(verdamping + condensatie)', cx, cy - labelR + 8);
  }

  // ── Droge Lucht ──
  function drawAirDroog() {
    if (!showLayer('airDroog')) return;

    const inner = R * LAYERS.airDroog.inner;
    const outer = R * LAYERS.airDroog.outer;

    // Droge zone (bijna onzichtbaar, geen water)
    const aGrad = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    aGrad.addColorStop(0, 'rgba(140,160,180,0)');
    aGrad.addColorStop(0.5, 'rgba(140,160,180,0.08)');
    aGrad.addColorStop(1, 'rgba(140,160,180,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.arc(cx, cy, inner, 0, Math.PI * 2, true);
    ctx.fillStyle = aGrad;
    ctx.fill();

    // Droge deeltjes (minder, kleiner)
    const particles = 8;
    for (let i = 0; i < particles; i++) {
      const angle = (i / particles) * Math.PI * 2 + time * 0.01;
      const r = inner + (outer - inner) * ((Math.sin(time * 0.2 + i * 4) + 1) / 2);
      const px = cx + Math.cos(angle) * r;
      const py = cy + Math.sin(angle) * r;

      ctx.beginPath();
      ctx.arc(px, py, 0.8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(140,160,180,0.08)';
      ctx.fill();
    }

    // Label
    const labelR = (inner + outer) / 2;
    ctx.fillStyle = 'rgba(140,160,180,0.07)';
    ctx.font = '0.3em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('lucht (droog)', cx, cy - labelR);
    ctx.font = '0.23em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(140,160,180,0.05)';
    ctx.fillText('(hoog druk, geen water)', cx, cy - labelR + 8);
  }

  // ── IJspolen (dynamisch, reageert op zon + drukveld) ──
  function drawIcePoles() {
    if (!showLayer('ice')) return;

    // Ijs ALLEEN boven en onder
    const inner = R * LAYERS.ice.inner;
    const outer = R * LAYERS.ice.outer;
    const basePoleAngle = Math.PI * 0.2; // 36 graden boven/onder

    // Zon positie bepaalt ijsdikte (zon = warmte = minder ijs)
    let sunAngle = 0;
    if (showPlanets) {
      const zon = PLANETS.find(p => p.name === 'zon');
      if (zon) sunAngle = time * zon.speed + zon.phase;
    }

    // Hoe dicht bij pool = hoe meer smelt
    // Noordpool = -PI/2, Zuidpool = PI/2
    const northProx = Math.cos(sunAngle - (-Math.PI / 2)); // -1..1, 1=dichtbij
    const southProx = Math.cos(sunAngle - (Math.PI / 2));

    // Ijs reageert: dicht bij zon = minder ijs, ver = meer ijs
    // poleAngle wordt kleiner als zon dichtbij (ijs smelt)
    // poleAngle wordt groter als zon ver (ijs groeit)
    const northPoleAngle = basePoleAngle * (1 - northProx * 0.3); // -30% tot +30%
    const southPoleAngle = basePoleAngle * (1 - southProx * 0.3);

    // Alpha wordt ook minder als zon dichtbij
    const northIceAlpha = 0.3 * (1 - northProx * 0.4);
    const southIceAlpha = 0.3 * (1 - southProx * 0.4);

    // Noordpool (boven)
    const northGrad = ctx.createRadialGradient(cx, cy - inner, 0, cx, cy - outer, outer - inner);
    northGrad.addColorStop(0, `rgba(230,240,250,${northIceAlpha})`);
    northGrad.addColorStop(1, 'rgba(200,210,220,0.05)');

    ctx.beginPath();
    ctx.arc(cx, cy, outer, -Math.PI/2 - northPoleAngle, -Math.PI/2 + northPoleAngle);
    ctx.arc(cx, cy, inner, -Math.PI/2 + northPoleAngle, -Math.PI/2 - northPoleAngle, true);
    ctx.closePath();
    ctx.fillStyle = northGrad;
    ctx.fill();

    // Zuidpool (onder)
    const southGrad = ctx.createRadialGradient(cx, cy + inner, 0, cx, cy + outer, outer - inner);
    southGrad.addColorStop(0, `rgba(230,240,250,${southIceAlpha})`);
    southGrad.addColorStop(1, 'rgba(200,210,220,0.05)');

    ctx.beginPath();
    ctx.arc(cx, cy, outer, Math.PI/2 - southPoleAngle, Math.PI/2 + southPoleAngle);
    ctx.arc(cx, cy, inner, Math.PI/2 + southPoleAngle, Math.PI/2 - southPoleAngle, true);
    ctx.closePath();
    ctx.fillStyle = southGrad;
    ctx.fill();

    // Ijs textuur
    const cracks = 6;
    for (let i = 0; i < cracks; i++) {
      // Noord
      const nAngle = -Math.PI/2 + (i / cracks) * northPoleAngle * 2 - northPoleAngle;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(nAngle) * inner, cy + Math.sin(nAngle) * inner);
      ctx.lineTo(cx + Math.cos(nAngle + 0.05) * outer, cy + Math.sin(nAngle + 0.05) * outer);
      ctx.strokeStyle = `rgba(230,240,250,${northIceAlpha * 0.3})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();

      // Zuid
      const sAngle = Math.PI/2 + (i / cracks) * southPoleAngle * 2 - southPoleAngle;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(sAngle) * inner, cy + Math.sin(sAngle) * inner);
      ctx.lineTo(cx + Math.cos(sAngle + 0.05) * outer, cy + Math.sin(sAngle + 0.05) * outer);
      ctx.strokeStyle = `rgba(230,240,250,${southIceAlpha * 0.3})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Labels
    ctx.fillStyle = `rgba(230,240,250,${Math.max(northIceAlpha, southIceAlpha) * 0.7})`;
    ctx.font = '0.35em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('noordpool', cx, cy - outer + 12);
    ctx.fillText('zuidpool', cx, cy + outer - 4);
    ctx.font = '0.20em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(230,240,250,0.1)';
    ctx.fillText('(ijs volgt zonafstand)', cx, cy + outer - 16);
  }

  // ── Zonnestelsel (6 planeten + maan, 4 punten op 0) ──
  const PLANETS = [
    { name: 'maan',     orbitR: 1.12, size: 2.5, color: [200,210,220], speed: 0.6,  phase: 0,       note: 'getijden' },
    { name: 'venus',    orbitR: 1.22, size: 4,   color: [230,200,100], speed: 0.35, phase: 1.2,     note: 'zon resonantie' },
    { name: 'aarde',    orbitR: 1.33, size: 5,   color: [100,150,200], speed: 0.25, phase: 2.5,     note: 'centrum' },
    { name: 'mars',     orbitR: 1.44, size: 4,   color: [200,100,60],  speed: 0.18, phase: 3.8,     note: 'spiegel, zand' },
    { name: 'jupiter',  orbitR: 1.58, size: 7,   color: [180,150,100], speed: 0.1,  phase: 5.0,     note: 'grote broer' },
    { name: 'zon',      orbitR: 1.72, size: 10,  color: [255,200,50],  speed: 0.05, phase: 0,       note: 'plasma bron' },
  ];

  // ── Zwart Gat Brug (core → elke planeet, E/M veld) ──
  // Invloed op water: zon felst, maan kort maar intens, mars zwakker
  function drawBlackHoleBridge() {
    if (!showPlanets) return;

    const baseR = R * 1.05;
    const coreR = R * LAYERS.core.outer;
    const holeR = coreR * 0.25;

    // Invloed op water per planeet (sterkte van E/M effect)
    const influence = {
      'maan':     { strength: 0.7,  color: [200,210,220], label: 'getijden kracht' },
      'venus':    { strength: 0.4,  color: [230,200,100], label: 'zon resonantie' },
      'aarde':    { strength: 0.3,  color: [100,150,200], label: 'self' },
      'mars':     { strength: 0.2,  color: [200,100,60],  label: 'verborgen E/M' },
      'jupiter':  { strength: 0.5,  color: [180,150,100], label: 'grote broer' },
      'zon':      { strength: 1.0,  color: [255,200,50],  label: 'plasma bron' },
    };

    for (let p = 0; p < PLANETS.length; p++) {
      const pl = PLANETS[p];
      const inf = influence[pl.name];
      if (!inf) continue;

      const angle = time * pl.speed + pl.phase;
      const px = cx + Math.cos(angle) * baseR * pl.orbitR;
      const py = cy + Math.sin(angle) * baseR * pl.orbitR;

      // Buigende lijn (vortex curve) van centrum → planeet
      // Midpoint buigt naar buiten (zoals zon effect)
      const steps = 30;
      const midBend = 30 * inf.strength; // hoe fel, hoe meer buiging

      // Hoofdlijn
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        let x = cx + (px - cx) * t;
        let y = cy + (py - cy) * t;

        // Buiging naar buiten (perpendiculair)
        const perpX = -(py - cy);
        const perpY = (px - cx);
        const perpLen = Math.sqrt(perpX * perpX + perpY * perpY) || 1;
        const bendAmount = Math.sin(t * Math.PI) * midBend;
        x += (perpX / perpLen) * bendAmount;
        y += (perpY / perpLen) * bendAmount;

        // Subtiele vortex oscillatie
        const vortexR = 5 * inf.strength * (1 - Math.abs(t - 0.5) * 2);
        const vortexAngle = t * Math.PI * 4 + time * 2 * coreSpeed;
        x += Math.cos(vortexAngle) * vortexR;
        y += Math.sin(vortexAngle) * vortexR;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      const alpha = 0.08 + inf.strength * 0.12 + Math.sin(time * 1.5 + p) * 0.03;
      ctx.strokeStyle = `rgba(${inf.color[0]},${inf.color[1]},${inf.color[2]},${alpha})`;
      ctx.lineWidth = 0.5 + inf.strength * 0.5;
      ctx.stroke();

      // Parallelle E/M lijn (dunner, zwevend)
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        let x = cx + (px - cx) * t;
        let y = cy + (py - cy) * t;

        const perpX = -(py - cy);
        const perpY = (px - cx);
        const perpLen = Math.sqrt(perpX * perpX + perpY * perpY) || 1;
        const bendAmount = Math.sin(t * Math.PI) * (midBend - 5);
        x += (perpX / perpLen) * bendAmount;
        y += (perpY / perpLen) * bendAmount;

        const vortexR = 3 * inf.strength * (1 - Math.abs(t - 0.5) * 2);
        const vortexAngle = t * Math.PI * 3 - time * 1.5 + p;
        x += Math.cos(vortexAngle) * vortexR;
        y += Math.sin(vortexAngle) * vortexR;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(${inf.color[0]},${inf.color[1]},${inf.color[2]},${alpha * 0.5})`;
      ctx.lineWidth = 0.3;
      ctx.stroke();

      // Invloed indicator bij planeet (water effect)
      if (inf.strength > 0.3) {
        const waterEffect = inf.strength * (0.5 + Math.sin(time * 2 + p) * 0.5);
        ctx.beginPath();
        ctx.arc(px, py, pl.size + 4 + waterEffect * 3, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${inf.color[0]},${inf.color[1]},${inf.color[2]},${waterEffect * 0.15})`;
        ctx.lineWidth = 0.5;
        ctx.setLineDash([2, 3]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Zwart gat label bij centrum
    ctx.fillStyle = 'rgba(255,100,30,0.2)';
    ctx.font = '0.22em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('zwart gat → E/M bruggen', cx, cy + coreR + 20);
    ctx.font = '0.18em "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(255,100,30,0.1)';
    ctx.fillText('invloed op water', cx, cy + coreR + 32);
  }

  let showPlanets = true;
  let showCycle = true;

  // ── Watercyclus deeltjes ──
  // Verdamping: water → vochtige lucht (omhoog)
  // Regen: vochtige lucht → water (omlaag)
  // Bevriezing: water → poolijs (naar polen)
  const CYCLE_PARTICLES = 40;
  let evapParticles = [];
  let rainParticles = [];
  let freezeParticles = [];

  // ── Kosmische invloed per laag ──
  // Elke planeet stuurt een specifieke laag aan
  const COSMIC_INFLUENCE = {
    'zon':    { layer: 'water',   type: 'verdamping', strength: 0.9 },
    'maan':   { layer: 'water',   type: 'getijden',   strength: 0.7 },
    'venus':  { layer: 'airVocht', type: 'condensatie', strength: 0.4 },
    'jupiter':{ layer: 'em',      type: 'magnetisch', strength: 0.5 },
    'mars':   { layer: 'aarde',   type: 'sediment',   strength: 0.2 },
  };

  function drawPlanets() {
    if (!showPlanets) return;

    const baseR = R * 1.05; // net buiten de planeet

    // 4 ankerpunten (cardinalen)
    const anchors = 4;
    for (let i = 0; i < anchors; i++) {
      const a = (i / anchors) * Math.PI * 2 + time * 0.01;
      const ax = cx + Math.cos(a) * baseR * 1.8;
      const ay = cy + Math.sin(a) * baseR * 1.8;

      ctx.beginPath();
      ctx.arc(ax, ay, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(124,110,245,0.2)';
      ctx.fill();
    }

    // Orbit ringen + planeten
    for (let p = 0; p < PLANETS.length; p++) {
      const pl = PLANETS[p];
      const orbitRadius = baseR * pl.orbitR;
      const angle = time * pl.speed + pl.phase;

      // Orbit ring (subtiel)
      ctx.beginPath();
      ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},0.06)`;
      ctx.lineWidth = 0.3;
      ctx.stroke();

      // Planeet positie
      const px = cx + Math.cos(angle) * orbitRadius;
      const py = cy + Math.sin(angle) * orbitRadius;

      // Glow
      const glowGrad = ctx.createRadialGradient(px, py, 0, px, py, pl.size * 3);
      glowGrad.addColorStop(0, `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},0.15)`);
      glowGrad.addColorStop(1, `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},0)`);
      ctx.beginPath();
      ctx.arc(px, py, pl.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = glowGrad;
      ctx.fill();

      // Planeet
      ctx.beginPath();
      ctx.arc(px, py, pl.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},0.3)`;
      ctx.fill();

      // Zon speciale effect (plasma bron)
      if (pl.name === 'zon') {
        // Stralen
        for (let r = 0; r < 6; r++) {
          const rAngle = (r / 6) * Math.PI * 2 + time * 0.3;
          const rInner = pl.size + 2;
          const rOuter = pl.size + 6 + Math.sin(time * 2 + r) * 2;
          ctx.beginPath();
          ctx.moveTo(px + Math.cos(rAngle) * rInner, py + Math.sin(rAngle) * rInner);
          ctx.lineTo(px + Math.cos(rAngle) * rOuter, py + Math.sin(rAngle) * rOuter);
          ctx.strokeStyle = 'rgba(255,200,50,0.15)';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }

      // Label
      ctx.fillStyle = `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},0.35)`;
      ctx.font = '0.28em "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(pl.name, px, py - pl.size - 4);
      ctx.font = '0.2em "IBM Plex Mono", monospace';
      ctx.fillStyle = `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},0.12)`;
      ctx.fillText(pl.note, px, py + pl.size + 6);
    }

    // Resonantielijnen tussen paren
    const pairs = [
      [0, 2], // maan ↔ aarde
      [1, 5], // venus ↔ zon
      [2, 3], // aarde ↔ mars
    ];

    for (const [a, b] of pairs) {
      const pa = PLANETS[a], pb = PLANETS[b];
      const angleA = time * pa.speed + pa.phase;
      const angleB = time * pb.speed + pb.phase;

      const ax = cx + Math.cos(angleA) * baseR * pa.orbitR;
      const ay = cy + Math.sin(angleA) * baseR * pa.orbitR;
      const bx = cx + Math.cos(angleB) * baseR * pb.orbitR;
      const by = cy + Math.sin(angleB) * baseR * pb.orbitR;

      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      const pulse = 0.08 + Math.sin(time * 1.5 + a) * 0.03;
      ctx.strokeStyle = `rgba(124,110,245,${pulse})`;
      ctx.lineWidth = 0.4;
      ctx.setLineDash([4, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 0.0.0.0 label (buitenste rand)
    ctx.fillStyle = 'rgba(124,110,245,0.1)';
    ctx.font = '0.22em "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('0.0.0.0 → 4 punten', cx, cy - baseR * 1.85);

    // ── Kosmische invloed pijlen (planeet → laag) ──
    if (showPlanets) {
      for (const [planetName, inf] of Object.entries(COSMIC_INFLUENCE)) {
        const pl = PLANETS.find(p => p.name === planetName);
        if (!pl) continue;

        const pAngle = time * pl.speed + pl.phase;
        const ppx = cx + Math.cos(pAngle) * baseR * pl.orbitR;
        const ppy = cy + Math.sin(pAngle) * baseR * pl.orbitR;

        // Target: laag positie (binnen de planeet)
        let targetR, targetAngle;
        switch (inf.layer) {
          case 'water':
            targetR = R * (LAYERS.water.inner + LAYERS.water.outer) / 2;
            targetAngle = Math.PI * 0.7; // links
            break;
          case 'airVocht':
            targetR = R * (LAYERS.airVocht.inner + LAYERS.airVocht.outer) / 2;
            targetAngle = -Math.PI * 0.3; // rechts-boven
            break;
          case 'em':
            targetR = R * (LAYERS.em.inner + LAYERS.em.outer) / 2;
            targetAngle = Math.PI * 0.5; // onder
            break;
          case 'aarde':
            targetR = R * (LAYERS.aarde.inner + LAYERS.aarde.outer) / 2;
            targetAngle = Math.PI * 1.1; // links-onder
            break;
          default:
            targetR = R * 0.5;
            targetAngle = 0;
        }

        const tx = cx + Math.cos(targetAngle) * targetR;
        const ty = cy + Math.sin(targetAngle) * targetR;

        // Gebogen pijl (planeet → laag)
        const steps = 20;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          let x = ppx + (tx - ppx) * t;
          let y = ppy + (ty - ppy) * t;

          // Buiging naar buiten
          const perpX = -(ty - ppy);
          const perpY = (tx - ppx);
          const perpLen = Math.sqrt(perpX * perpX + perpY * perpY) || 1;
          const bend = Math.sin(t * Math.PI) * 15 * inf.strength;
          x += (perpX / perpLen) * bend;
          y += (perpY / perpLen) * bend;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        const infAlpha = 0.04 + inf.strength * 0.06 + Math.sin(time * 1.2 + PLANETS.indexOf(pl)) * 0.02;
        ctx.strokeStyle = `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},${infAlpha})`;
        ctx.lineWidth = 0.3 + inf.strength * 0.3;
        ctx.setLineDash([3, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Pijlkop bij doel
        const arrowSize = 3 + inf.strength * 2;
        ctx.beginPath();
        ctx.arc(tx, ty, arrowSize, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},${infAlpha * 1.5})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // Label bij doel
        ctx.fillStyle = `rgba(${pl.color[0]},${pl.color[1]},${pl.color[2]},${infAlpha * 1.2})`;
        ctx.font = '0.18em "IBM Plex Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${inf.type} ← ${planetName}`, tx + 20, ty + 2);
      }
    }
  }

  // ── Buitenste rand ──
  function drawOuterRing() {
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(120,160,220,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ── Laag grenzen (dunne ringen tussen lagen) ──
  function drawLayerBorders() {
    if (viewMode !== 'all') return;
    const borders = [0.15, 0.30, 0.40, 0.65, 0.80, 0.90];
    for (const b of borders) {
      const r = R * b;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(100,140,200,0.06)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }

  // ── Ripple visuals ──
  function drawRipples() {
    if (!audioOn) return;

    for (let si = 0; si < stones.length; si++) {
      const s = stones[si];
      const age = time - s.time;
      const ringDist = age * 60;
      const alpha = Math.exp(-age * 0.04) * 0.1;
      if (alpha > 0.003 && ringDist < R * 0.7) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, ringDist, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(160,200,240,${alpha * 2})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  // ── Main draw ──
  function draw() {
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);

    time += 0.016;
    if (audioOn) rippleTime += 0.016;

    drawPlasmaCore();
    drawAardeLayer();
    drawEMField();
    drawWaterLayer();
    drawRipples();
    drawAirVocht();
    drawAirDroog();
    drawPressureSystem();
    drawIcePoles();
    drawFeedbackLoop();
    drawOuterRing();
    drawLayerBorders();
    drawPlanets();
    drawBlackHoleBridge();

    // Info
    if (!audioOn) {
      infoEl.textContent = 'plasma core — stil';
    } else if (rippleTime < 2) {
      infoEl.textContent = `rimpel — ${rippleTime.toFixed(1)}s`;
    } else if (rippleTime < 8) {
      infoEl.textContent = `E/M resonantie — ${rippleTime.toFixed(1)}s`;
    } else {
      infoEl.textContent = `plasma ↔ ijs resonantie — ${rippleTime.toFixed(1)}s`;
    }

    requestAnimationFrame(draw);
  }

  // ── Aarde rotatie slider ──
  const earthSlider = document.getElementById('earthSpeed');
  const earthSliderVal = document.getElementById('earthSpeedVal');
  const balanceDisplay = document.getElementById('balanceDisplay');

  function calcCoreSpeed() {
    earthRotationMult = parseFloat(earthSlider.value);
    // Core snelheid = maan orbit / aarde rotatie (balans)
    // Als aarde sneller draait → core langzamer voor balans 1=0
    // Als aarde langzamer draait → core sneller voor balans 1=0
    coreSpeed = moonOrbitSpeed / earthRotationMult;
    earthSliderVal.textContent = earthRotationMult.toFixed(1) + '×';
    balanceDisplay.textContent = `maan orbit: 1× → aarde: ${earthRotationMult.toFixed(1)}× → core: ${coreSpeed.toFixed(2)}× → balans 1=0`;
  }
  earthSlider.addEventListener('input', calcCoreSpeed);

  // ── Mode buttons ──
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.mode === 'cycle') {
        showCycle = !showCycle;
        btn.classList.toggle('active', showCycle);
        return;
      }
      // Keep cycle button state independent
      const cycleBtn = document.querySelector('.mode-btn[data-mode="cycle"]');
      document.querySelectorAll('.mode-btn').forEach(b => {
        if (b.dataset.mode !== 'cycle') b.classList.remove('active');
      });
      btn.classList.add('active');
      viewMode = btn.dataset.mode;
    });
  });

  // ── Steen gooien ──
  stoneBtn.addEventListener('click', () => {
    initAudio();
    audioOn = !audioOn;
    setAudio(audioOn);

    if (audioOn) {
      stones.push({
        x: cx + (Math.random() - 0.5) * R * 0.3,
        y: cy + (Math.random() - 0.5) * R * 0.3,
        time: time
      });
      stoneBtn.textContent = '● stil';
      stoneBtn.classList.add('rippled');
      elSub.textContent = 'steen → rimpel → E/M resonantie → plasma ↔ ijs';
    } else {
      stones = [];
      rippleTime = 0;
      stoneBtn.textContent = '● steen gooien';
      stoneBtn.classList.remove('rippled');
      elSub.textContent = 'plasma core (druk↔) → aarde → E/M → water → lucht (L/H druk → wind) → wolken → ijs';
    }
  });

  // Click = steen (in water zone)
  canvas.addEventListener('click', (e) => {
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > R || dist < R * 0.35) return;

    if (!audioOn) {
      initAudio();
      audioOn = true;
      setAudio(true);
      stoneBtn.textContent = '● stil';
      stoneBtn.classList.add('rippled');
    }

    stones.push({ x: e.clientX, y: e.clientY, time: time });
  });

  draw();
})();
</script>
</body>
</html>
