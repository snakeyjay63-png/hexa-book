<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>• Zee — Hexa-Book Kunstwerk</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06060a; color: #e0e0e0; font-family: 'IBM Plex Mono', monospace; overflow: hidden; }
    canvas { display: block; }

    .ui { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; }
    .element-label { font-size: 1.4em; color: #7c6ef5; margin-bottom: 8px; }
    .element-sub { font-size: 0.8em; color: #888; margin-bottom: 16px; }

    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      background: rgba(124,110,245,0.1); border: 1px solid rgba(124,110,245,0.3);
      color: #c0b8e8; padding: 10px 20px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 0.85em; transition: all 0.3s;
    }
    .btn:hover { background: rgba(124,110,245,0.25); }
    .btn.active { background: rgba(124,110,245,0.35); border-color: #7c6ef5; color: #fff; }

    .speed-row { margin-top: 12px; display: flex; gap: 8px; justify-content: center; align-items: center; }
    .speed-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
      color: #888; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.75em;
    }
    .speed-btn:hover { background: rgba(255,255,255,0.1); }
    .speed-btn.active { background: rgba(124,110,245,0.2); border-color: rgba(124,110,245,0.5); color: #c0b8e8; }

    .audio-btn {
      background: rgba(124,110,245,0.08); border: 1px solid rgba(124,110,245,0.2);
      color: #666; padding: 5px 12px; border-radius: 4px; cursor: pointer;
      font-family: inherit; font-size: 0.75em; margin-top: 12px;
    }
    .audio-btn.on { background: rgba(124,110,245,0.25); border-color: #7c6ef5; color: #c0b8e8; }

    .back-link {
      position: fixed; top: 20px; left: 20px; color: #555; text-decoration: none;
      font-size: 0.8em; z-index: 10; transition: color 0.3s;
    }
    .back-link:hover { color: #7c6ef5; }
  </style>
</head>
<body>
  <a href="bit.html" class="back-link">← bit</a>
  <a href="index.html" class="back-link" style="top:50px;">← hexa-book</a>

  <canvas id="c"></canvas>

  <div class="ui">
    <div class="element-label" id="el-label">zee</div>
    <div class="element-sub" id="el-sub">elk punt = atoom met E/M veld</div>
    <div class="btn-row">
      <button class="btn" data-e="schelp">schelp</button>
      <button class="btn active" data-e="zee">zee</button>
      <button class="btn" data-e="regen">regen</button>
      <button class="btn" data-e="water">water</button>
      <button class="btn" data-e="wind">wind</button>
    </div>
    <div class="speed-row">
      <button class="speed-btn" data-s="0.5">0.5×</button>
      <button class="speed-btn active" data-s="1">1×</button>
      <button class="speed-btn" data-s="2">2×</button>
    </div>
    <button class="audio-btn" id="audio-toggle">♪ aan</button>
  </div>

<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Audio: één white noise bron, filters = element ──
  let audioCtx = null;
  let audioNodes = null;
  let currentElement = 'zee';
  let audioOn = false;

  function initAudio() {
    if (audioCtx) { audioOn = true; return; }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const bufSize = audioCtx.sampleRate * 4;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const bp1 = audioCtx.createBiquadFilter();
    bp1.type = 'bandpass'; bp1.frequency.value = 300; bp1.Q.value = 0.5;
    const bp2 = audioCtx.createBiquadFilter();
    bp2.type = 'bandpass'; bp2.frequency.value = 300; bp2.Q.value = 0.5;

    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.2;
    lfoGain.gain.value = 100;
    lfo.connect(lfoGain);
    lfoGain.connect(bp1.frequency);
    lfo.start();

    const master = audioCtx.createGain();
    master.gain.value = 0.1;

    noise.connect(bp1); noise.connect(bp2);
    bp1.connect(master); bp2.connect(master);
    master.connect(audioCtx.destination);
    noise.start();

    audioNodes = { noise, bp1, bp2, lfo, lfoGain, master };
  }

  function setElement(el) {
    currentElement = el;
    const n = audioNodes;
    const t = 1;

    switch(el) {
      case 'schelp':
        n.bp1.frequency.setTargetAtTime(250, audioCtx.currentTime, t); n.bp1.Q.setTargetAtTime(0.3, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(500, audioCtx.currentTime, t); n.bp2.Q.setTargetAtTime(0.2, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(0.15, audioCtx.currentTime, t); n.lfoGain.gain.setTargetAtTime(80, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.12, audioCtx.currentTime, t);
        break;
      case 'zee':
        n.bp1.frequency.setTargetAtTime(200, audioCtx.currentTime, t); n.bp1.Q.setTargetAtTime(0.5, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(2000, audioCtx.currentTime, t); n.bp2.Q.setTargetAtTime(1, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(0.1, audioCtx.currentTime, t); n.lfoGain.gain.setTargetAtTime(120, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.1, audioCtx.currentTime, t);
        break;
      case 'regen':
        n.bp1.frequency.setTargetAtTime(4000, audioCtx.currentTime, t); n.bp1.Q.setTargetAtTime(2, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(6000, audioCtx.currentTime, t); n.bp2.Q.setTargetAtTime(3, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(2, audioCtx.currentTime, t); n.lfoGain.gain.setTargetAtTime(500, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.06, audioCtx.currentTime, t);
        break;
      case 'water':
        n.bp1.frequency.setTargetAtTime(800, audioCtx.currentTime, t); n.bp1.Q.setTargetAtTime(1.5, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(1500, audioCtx.currentTime, t); n.bp2.Q.setTargetAtTime(1, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(0.5, audioCtx.currentTime, t); n.lfoGain.gain.setTargetAtTime(300, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.08, audioCtx.currentTime, t);
        break;
      case 'wind':
        n.bp1.frequency.setTargetAtTime(150, audioCtx.currentTime, t); n.bp1.Q.setTargetAtTime(0.8, audioCtx.currentTime, t);
        n.bp2.frequency.setTargetAtTime(800, audioCtx.currentTime, t); n.bp2.Q.setTargetAtTime(2, audioCtx.currentTime, t);
        n.lfo.frequency.setTargetAtTime(0.3, audioCtx.currentTime, t); n.lfoGain.gain.setTargetAtTime(400, audioCtx.currentTime, t);
        n.master.gain.setTargetAtTime(0.1, audioCtx.currentTime, t);
        break;
    }
  }

  function toggleAudio() {
    if (!audioNodes) {
      initAudio();
      setElement(currentElement);
      return true;
    }
    // Toggle mute
    const n = audioNodes;
    const isMuted = n.master.gain.value === 0;
    const wasMuted = n.master.gain.value === 0;
    n.master.gain.setTargetAtTime(wasMuted ? 0.1 : 0, audioCtx.currentTime, 0.3);
    audioOn = wasMuted;
    return audioOn;
  }

  // ── Atoom: elk punt water = atoom met E/M veld ──
  // Elk atoom heeft:
  // - Positie (x, y)
  // - Eigen frequentie (f) — de 'toon' van het atoom
  // - Eigen fase (phase) — offset in cyclus
  // - E-veld (elektrisch) — aantrekkingskracht
  // - M-veld (magnetisch) — afstoting/rotatie
  // - Diepte (depth) — hoe 'diep' het atoom zit in de zee
  // - Resonantie — hoe sterk het reageert op andere atomen

  let atoms = [];
  let time = 0;
  let speedMultiplier = 1;

  // Grid-based interaction (optimalisatie)
  const GRID_SIZE = 50; // celgrootte voor binned interaction
  let grid = {};

  function createAtom(x, y, element) {
    const atom = {
      x: x || Math.random() * W,
      y: y || Math.random() * H,
      vx: 0, vy: 0,
      // Eigen E/M veld
      f: 0.5 + Math.random() * 2,       // frequentie (Hz)
      phase: Math.random() * Math.PI * 2, // fase-offset
      depth: 0.2 + Math.random() * 0.8,  // diepte (0-1)
      e: 0.5 + Math.random() * 0.5,      // E-veld sterkte
      m: 0.3 + Math.random() * 0.7,      // M-veld sterkte
      radius: 1 + Math.random() * 2,
      life: 1,
      decay: 0.0003 + Math.random() * 0.001,
      // Resonantie
      resonance: 0.8 + Math.random() * 0.4, // hoe sterk reageer ik?
    };

    // Element-specifieke eigenschappen
    switch(element) {
      case 'schelp':
        atom.f = 0.3 + Math.random() * 0.5;
        atom.e = 0.8; // sterke attractie = cirkelvormig
        atom.m = 0.2; // zwakke rotatie
        atom.vx = (Math.random() - 0.5) * 0.1;
        atom.vy = (Math.random() - 0.5) * 0.1;
        break;
      case 'zee':
        atom.f = 0.5 + Math.random() * 1;
        atom.e = 0.5 + Math.random() * 0.3;
        atom.m = 0.4 + Math.random() * 0.4;
        atom.vx = (Math.random() - 0.5) * 0.3;
        atom.vy = -0.1 - Math.random() * 0.3;
        break;
      case 'regen':
        atom.f = 3 + Math.random() * 5;
        atom.e = 0.3; // zwakke binding
        atom.m = 0.1;
        atom.vx = (Math.random() - 0.5) * 0.3;
        atom.vy = 2 + Math.random() * 3;
        atom.decay = 0.005;
        break;
      case 'water':
        atom.f = 1 + Math.random() * 2;
        atom.e = 0.6 + Math.random() * 0.3;
        atom.m = 0.3 + Math.random() * 0.3;
        atom.vx = (Math.random() - 0.5) * 0.2;
        atom.vy = 0.5 + Math.random() * 1.5;
        atom.decay = 0.002;
        break;
      case 'wind':
        atom.f = 0.8 + Math.random() * 2;
        atom.e = 0.2; // geen binding
        atom.m = 0.8 + Math.random() * 0.5; // sterke rotatie
        atom.vx = 1 + Math.random() * 2;
        atom.vy = (Math.random() - 0.5) * 0.5;
        atom.decay = 0.003;
        break;
    }

    return atom;
  }

  // ── Binned interaction grid ──
  function updateGrid() {
    grid = {};
    atoms.forEach((a, i) => {
      const gx = Math.floor(a.x / GRID_SIZE);
      const gy = Math.floor(a.y / GRID_SIZE);
      const key = gx + ',' + gy;
      if (!grid[key]) grid[key] = [];
      grid[key].push(i);
    });
  }

  function getNearbyAtoms(x, y) {
    const gx = Math.floor(x / GRID_SIZE);
    const gy = Math.floor(y / GRID_SIZE);
    const nearby = [];
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const key = (gx + dx) + ',' + (gy + dy);
        if (grid[key]) {
          grid[key].forEach(idx => nearby.push(idx));
        }
      }
    }
    return nearby;
  }

  // ── E/M veld interactie ──
  // E-veld: aantrekking (als elektrische lading)
  // M-veld: rotatie/afstoting (als magnetisch veld)
  function applyFieldInteractions(atom, dt) {
    const nearby = getNearbyAtoms(atom.x, atom.y);
    let fx = 0, fy = 0;

    for (let i = 0; i < nearby.length; i++) {
      const other = atoms[nearby[i]];
      if (other === atom) continue;

      const dx = other.x - atom.x;
      const dy = other.y - atom.y;
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq) || 1;

      // E-veld: aantrekking (omgekeerd kwadraat)
      const eForce = atom.e * other.e * 0.5 / (distSq + 100);
      fx += (dx / dist) * eForce * dt;
      fy += (dy / dist) * eForce * dt;

      // M-veld: rotatie (perpendiculair)
      const mForce = atom.m * other.m * 0.3 / (distSq + 100);
      fx += (-dy / dist) * mForce * dt;
      fy += (dx / dist) * mForce * dt;

      // Resonantie: atomen met vergelijkbare frequentie trekken elkaar aan
      const freqDiff = Math.abs(atom.f - other.f);
      if (freqDiff < 1) {
        const resonance = (1 - freqDiff) * atom.resonance * 0.1;
        fx += (dx / dist) * resonance * dt;
        fy += (dy / dist) * resonance * dt;
      }
    }

    atom.vx += fx;
    atom.vy += fy;
  }

  // ── Element-specifieke visuals ──
  const elementColors = {
    schelp: '124, 110, 245',
    zee:    '100, 140, 220',
    regen:  '142, 202, 230',
    water:  '100, 180, 255',
    wind:   '160, 160, 200',
  };

  const elementSubs = {
    schelp: 'spiraal — nautilus',
    zee:    'elk punt = atoom met E/M veld',
    regen:  'druppels — hoge frequentie',
    water:  'stroom + binding',
    wind:   'geen binding — vrij veld',
  };

  let spawnTimer = 0;

  function draw() {
    // Fade = continue laag
    ctx.fillStyle = 'rgba(6, 6, 10, 0.02)';
    ctx.fillRect(0, 0, W, H);

    const dt = speedMultiplier;
    time += 0.016 * dt;

    // Spawn nieuwe atomen (meer met geluid)
    spawnTimer++;
    const spawnRate = { schelp: 10, zee: 12, regen: 20, water: 15, wind: 18 };
    const rate = Math.max(1, Math.round((spawnRate[currentElement] || 10) / (speedMultiplier * audioBoost)));
    if (spawnTimer % rate === 0) {
      // Spawn position afhankelijk van element
      let x, y;
      switch(currentElement) {
        case 'regen': x = Math.random() * W; y = -10; break;
        case 'wind': x = -10; y = Math.random() * H; break;
        case 'water': x = cx + (Math.random() - 0.5) * W * 0.6; y = -10; break;
        default: x = Math.random() * W; y = Math.random() * H;
      }
      atoms.push(createAtom(x, y, currentElement));
    }

    // Update grid voor interaction
    updateGrid();

    // Update atomen
    const color = elementColors[currentElement];
    const maxAtoms = 300;
    atoms = atoms.filter(a => a.life > 0 && atoms.length <= maxAtoms);

    // Geluid beïnvloedt visuals: audio aan = meer activiteit
    const audioBoost = audioOn ? 1.5 : 1;
    const fieldStrength = audioOn ? 1.2 : 0.6;

    atoms.forEach(a => {
      // E/M veld interactie (sterker met geluid)
      const localE = a.e * fieldStrength;
      const localM = a.m * fieldStrength;
      const saveE = a.e; const saveM = a.m;
      a.e = localE; a.m = localM;
      applyFieldInteractions(a, dt);
      a.e = saveE; a.m = saveM;

      // Eigen beweging (frequentie + fase)
      const selfMotion = Math.sin(time * a.f + a.phase) * 0.05 * a.depth;
      a.vx += selfMotion * Math.cos(a.phase);
      a.vy += selfMotion * Math.sin(a.phase);

      // Damping
      a.vx *= 0.98;
      a.vy *= 0.98;

      // Update positie
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.life -= a.decay * dt;

      // Wrap around
      if (a.x < -20) a.x = W + 20;
      if (a.x > W + 20) a.x = -20;
      if (a.y < -20) a.y = H + 20;
      if (a.y > H + 20) a.y = -20;
    });

    // Teken atomen
    atoms.forEach(a => {
      const r = Math.max(0.5, a.radius * a.life * a.depth);
      if (r <= 0) return;

      // E/M veld visualisatie: groter atoom = sterker veld
      const fieldRadius = r * (1 + a.e * 0.5);

      // Kern (groter met geluid)
      const audioSize = audioOn ? 1.3 : 1;
      const displayR = r * audioSize;
      ctx.beginPath();
      ctx.arc(a.x, a.y, displayR, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${color}, ${Math.min(0.4, a.life * 0.3 * a.depth * audioBoost)})`;
      ctx.fill();

      // Veld (sterker met geluid)
      if (a.e > 0.5 || a.m > 0.5) {
        const glowSize = audioOn ? 3 : 2;
        ctx.beginPath();
        ctx.arc(a.x, a.y, fieldRadius * glowSize, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${color}, ${Math.min(0.05, a.life * 0.02 * a.depth * audioBoost)})`;
        ctx.fill();
      }

      // Resonantie: verbind atomen met vergelijkbare frequentie
      if (a.resonance > 1) {
        const nearby = getNearbyAtoms(a.x, a.y);
        nearby.forEach(idx => {
          const other = atoms[idx];
          if (!other || other === a) return;
          const freqDiff = Math.abs(a.f - other.f);
          if (freqDiff < 0.5) {
            const dx = other.x - a.x;
            const dy = other.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 80) {
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(other.x, other.y);
              ctx.strokeStyle = `rgba(${color}, ${(1 - freqDiff) * 0.05 * a.depth})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        });
      }
    });

    requestAnimationFrame(draw);
  }

  // ── UI ──
  const elLabel = document.getElementById('el-label');
  const elSub = document.getElementById('el-sub');

  document.querySelectorAll('[data-e]').forEach(btn => {
    btn.addEventListener('click', () => {
      initAudio();
      setElement(btn.dataset.e);
      elLabel.textContent = btn.dataset.e;
      elSub.textContent = elementSubs[btn.dataset.e];
      document.querySelectorAll('[data-e]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      atoms = []; // reset
    });
  });

  document.querySelectorAll('[data-s]').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = parseFloat(btn.dataset.s);
      speedMultiplier = s;
      document.querySelectorAll('[data-s]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // Audio toggle
  const audioToggleBtn = document.getElementById('audio-toggle');
  audioToggleBtn.addEventListener('click', () => {
    const on = toggleAudio();
    audioToggleBtn.textContent = on ? '♪ aan' : '♪ uit';
    audioToggleBtn.classList.toggle('on', on);
  });

  // Start
  draw();
})();
</script>
</body>
</html>
