<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>• Zee — Horizontaal × Verticaal</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #06060a; color: #e0e0e0;
      font-family: 'IBM Plex Mono', monospace;
      overflow: hidden; cursor: crosshair;
    }
    canvas { display: block; }

    .ui {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 10;
    }
    .element-label { font-size: 1.4em; color: #7c6ef5; margin-bottom: 4px; }
    .element-sub { font-size: 0.7em; color: #666; margin-bottom: 12px; }

    .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .btn {
      background: rgba(124,110,245,0.05); border: 1px solid rgba(124,110,245,0.15);
      color: #888; padding: 6px 14px; border-radius: 4px; cursor: pointer;
      font-family: inherit; font-size: 0.75em; transition: all 0.3s;
    }
    .btn:hover { background: rgba(124,110,245,0.15); }
    .btn.active { background: rgba(124,110,245,0.2); border-color: rgba(124,110,245,0.4); color: #c0b8e8; }

    .stone-btn {
      margin-top: 10px;
      background: rgba(100,140,200,0.08); border: 1px solid rgba(100,140,200,0.2);
      color: #8ab4f8; padding: 8px 20px; border-radius: 20px; cursor: pointer;
      font-family: inherit; font-size: 0.85em; transition: all 0.5s;
    }
    .stone-btn:hover { background: rgba(100,140,200,0.15); }
    .stone-btn.rippled {
      background: rgba(100,140,200,0.25);
      border-color: rgba(100,140,200,0.5);
      box-shadow: 0 0 20px rgba(100,140,200,0.1);
    }

    .back-link {
      position: fixed; top: 20px; left: 20px; color: #555; text-decoration: none;
      font-size: 0.8em; z-index: 10; transition: color 0.3s;
    }
    .back-link:hover { color: #7c6ef5; }

    .info {
      position: fixed; top: 20px; right: 20px; color: #444; font-size: 0.65em;
      text-align: right; z-index: 10;
    }

    .mode-toggle {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; z-index: 10;
    }
    .mode-btn {
      background: rgba(124,110,245,0.05); border: 1px solid rgba(124,110,245,0.1);
      color: #555; padding: 4px 10px; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 0.6em; transition: all 0.3s;
    }
    .mode-btn:hover { background: rgba(124,110,245,0.1); }
    .mode-btn.active { background: rgba(124,110,245,0.15); color: #c0b8e8; border-color: rgba(124,110,245,0.3); }
  </style>
</head>
<body>
  <a href="bit.html" class="back-link">← bit</a>
  <a href="index.html" class="back-link" style="top:50px;">← hexa-book</a>
  <div class="info" id="info">spiegel — stil</div>

  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="both">horizontaal × verticaal</button>
    <button class="mode-btn" data-mode="horizontal">horizontaal</button>
    <button class="mode-btn" data-mode="vertical">verticaal</button>
  </div>

  <canvas id="c"></canvas>

  <div class="ui" id="ui">
    <div class="element-label">zee</div>
    <div class="element-sub" id="el-sub">horizontaal (breedte) × verticaal (diepte) — de engine achter 0.0.0.0</div>
    <button class="stone-btn" id="stone-btn">● steen gooien</button>
  </div>

<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const infoEl = document.getElementById('info');
  const elSub = document.getElementById('el-sub');
  const stoneBtn = document.getElementById('stone-btn');

  let W, H, cx, cy, pondRadius;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
    pondRadius = Math.min(W, H) * 0.38;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Concept ──
  //
  // Horizontaal = de zee zoals je hem ziet (de horizon, de breedte)
  // Verticaal = de diepte (oppervlak → afgrond)
  //
  // De engine achter 0.0.0.0:
  // Horizontale lijnen = scanlines van de zee
  // Verticale diepte = kleur van wit naar indigo
  //
  // Samen = de complete zee

  let viewMode = 'both'; // 'both' | 'horizontal' | 'vertical'
  let time = 0;
  let audioOn = false;
  let rippleTime = 0;
  let stones = [];

  // ── Audio ──
  let audioCtx = null;
  let audioNodes = null;

  function initAudio() {
    if (audioCtx) return true;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const bufSize = audioCtx.sampleRate * 4;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buf; noise.loop = true;

    const bp1 = audioCtx.createBiquadFilter();
    bp1.type = 'bandpass'; bp1.frequency.value = 400; bp1.Q.value = 0.5;
    const bp2 = audioCtx.createBiquadFilter();
    bp2.type = 'bandpass'; bp2.frequency.value = 400; bp2.Q.value = 0.5;

    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.15;
    lfoGain.gain.value = 200;
    lfo.connect(lfoGain);
    lfoGain.connect(bp1.frequency);
    lfo.start();

    const master = audioCtx.createGain();
    master.gain.value = 0;

    noise.connect(bp1); noise.connect(bp2);
    bp1.connect(master); bp2.connect(master);
    master.connect(audioCtx.destination);
    noise.start();

    audioNodes = { noise, bp1, bp2, lfo, lfoGain, master };
    return true;
  }

  function setAudio(on) {
    if (!audioNodes) return;
    const t = 1;
    const n = audioNodes;
    if (on) {
      n.bp1.frequency.setTargetAtTime(250, audioCtx.currentTime, t);
      n.bp1.Q.setTargetAtTime(0.5, audioCtx.currentTime, t);
      n.bp2.frequency.setTargetAtTime(1800, audioCtx.currentTime, t);
      n.bp2.Q.setTargetAtTime(1.5, audioCtx.currentTime, t);
      n.lfo.frequency.setTargetAtTime(0.08, audioCtx.currentTime, t);
      n.lfoGain.gain.setTargetAtTime(150, audioCtx.currentTime, t);
      n.master.gain.setTargetAtTime(0.08, audioCtx.currentTime, t);
    } else {
      n.master.gain.setTargetAtTime(0, audioCtx.currentTime, t);
    }
  }

  // ── Golven ──
  function getWaveHeight(px, py, t) {
    let h = 0;
    for (let si = 0; si < stones.length; si++) {
      const s = stones[si];
      const age = t - s.time;
      const speed = 80;

      const dx = px - s.x;
      const dy = py - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const ringDist = age * speed;
      const ringWidth = 40 + age * 15;

      if (Math.abs(dist - ringDist) < ringWidth) {
        const ripple = Math.sin((dist - ringDist) * 0.08) *
                       Math.exp(-age * 0.12) *
                       Math.exp(-Math.abs(dist - ringDist) / ringWidth);
        h += ripple * 20;
      }

      // Reflected
      const sDx = s.x - cx;
      const sDy = s.y - cy;
      const sDist = Math.sqrt(sDx * sDx + sDy * sDy);
      if (sDist < pondRadius) {
        const mirrorDist = 2 * pondRadius - sDist;
        const mirrorAngle = Math.atan2(sDy, sDx);
        const mx = cx + mirrorDist * Math.cos(mirrorAngle);
        const my = cy + mirrorDist * Math.sin(mirrorAngle);

        const rdx = px - mx;
        const rdy = py - my;
        const rDist = Math.sqrt(rdx * rdx + rdy * rdy);
        const rRingDist = (age + sDist / speed) * speed;
        const rRingWidth = ringWidth * 0.7;

        if (Math.abs(rDist - rRingDist) < rRingWidth) {
          const rRipple = Math.sin((rDist - rRingDist) * 0.08) *
                          Math.exp(-age * 0.12) *
                          Math.exp(-Math.abs(rDist - rRingDist) / rRingWidth);
          h += rRipple * 8;
        }
      }
    }
    return h;
  }

  // ── Diepte kleur ──
  function depthColor(depth) {
    // depth: 0 = oppervlak (helder), 1 = diepte (indigo)
    const r = Math.round(240 - depth * 220);
    const g = Math.round(245 - depth * 225);
    const b = Math.round(255 - depth * 175);
    return { r, g, b };
  }

  // ── Tekenen ──
  function draw() {
    ctx.fillStyle = '#06060a';
    ctx.fillRect(0, 0, W, H);

    time += 0.016;
    if (audioOn) rippleTime += 0.016;

    // ── Clip to circle ──
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, pondRadius, 0, Math.PI * 2);
    ctx.clip();

    // ── BASIS: diepte gradiënt ──
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, pondRadius);
    grad.addColorStop(0, '#0a0a2e');
    grad.addColorStop(0.5, '#1a1a4e');
    grad.addColorStop(1, '#3a4a6e');
    ctx.fillStyle = grad;
    ctx.fillRect(cx - pondRadius, cy - pondRadius, pondRadius * 2, pondRadius * 2);

    // ── HORIZONTAAL: scanlines ──
    // De zee zoals je hem ziet — de horizon
    const showHorizontal = (viewMode === 'horizontal' || viewMode === 'both');
    const hIntensity = (viewMode === 'horizontal') ? 1 : 0.5;

    if (showHorizontal) {
      const lineSpacing = 4;
      for (let y = cy - pondRadius; y < cy + pondRadius; y += lineSpacing) {
        const rowDy = y - cy;
        const rowHW = Math.sqrt(Math.max(0, pondRadius * pondRadius - rowDy * rowDy));
        if (rowHW < 1) continue;

        // Diepte van deze rij
        const depth = Math.abs(rowDy) / pondRadius;
        const c = depthColor(depth);

        // Golven
        let waveAlpha = 0;
        if (audioOn && stones.length > 0) {
          const h = getWaveHeight(cx, y, time);
          waveAlpha = Math.abs(h) * 0.008;
        }

        ctx.beginPath();
        ctx.moveTo(cx - rowHW, y);
        ctx.lineTo(cx + rowHW, y);

        const baseAlpha = 0.01 * hIntensity;
        const alpha = baseAlpha + waveAlpha;

        ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
        ctx.lineWidth = lineSpacing * 0.4;
        ctx.stroke();
      }
    }

    // ── VERTICAAL: diepte ──
    // De afgrond — oppervlak naar onder
    const showVertical = (viewMode === 'vertical' || viewMode === 'both');
    const vIntensity = (viewMode === 'vertical') ? 1 : 0.5;

    if (showVertical) {
      // Concentrische cirkels = diepte lagen
      const rings = 20;
      for (let r = 0; r <= rings; r++) {
        const ringR = (r / rings) * pondRadius;
        const depth = r / rings; // 0 = centrum (diep), 1 = rand (oppervlak)

        const c = depthColor(1 - depth); // omgekeerd: rand = licht, centrum = donker

        let waveAlpha = 0;
        if (audioOn && stones.length > 0) {
          const h = getWaveHeight(cx + ringR, cy, time);
          waveAlpha = Math.abs(h) * 0.005;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, ringR, 0, Math.PI * 2);

        const baseAlpha = 0.02 * vIntensity;
        const alpha = baseAlpha + waveAlpha;

        ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Verticale lijnen vanuit centrum
      const spokes = 12;
      for (let s = 0; s < spokes; s++) {
        const angle = (s / spokes) * Math.PI * 2;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(
          cx + Math.cos(angle) * pondRadius,
          cy + Math.sin(angle) * pondRadius
        );
        ctx.strokeStyle = `rgba(100,140,200,${0.008 * vIntensity})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }

    // ── Lichtreflectie op golftoppen ──
    if (audioOn) {
      const step = 6;
      for (let y = cy - pondRadius; y < cy + pondRadius; y += step) {
        const rowDy = y - cy;
        const rowHW = Math.sqrt(Math.max(0, pondRadius * pondRadius - rowDy * rowDy));

        for (let x = cx - rowHW; x < cx + rowHW; x += step) {
          const h = getWaveHeight(x, y, time);
          if (h > 2) {
            const px = x - cx;
            const py = y - cy;
            const dist = Math.sqrt(px * px + py * py);
            const depth = dist / pondRadius;

            const bright = h * 3 * (1 - depth);
            if (bright > 1) {
              ctx.beginPath();
              ctx.arc(x, y, bright * 0.2, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(240,245,255,${bright * 0.015})`;
              ctx.fill();
            }
          }
        }
      }
    }

    // ── Zon reflectie ──
    const sunX = cx + pondRadius * 0.3;
    const sunY = cy - pondRadius * 0.4;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, pondRadius * 0.4);
    sunGrad.addColorStop(0, 'rgba(255,255,255,0.02)');
    sunGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(cx - pondRadius, cy - pondRadius, pondRadius * 2, pondRadius * 2);

    ctx.restore();

    // ── Cirkel rand ──
    ctx.beginPath();
    ctx.arc(cx, cy, pondRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100,140,200,0.12)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // ── Ripple rings ──
    if (audioOn) {
      for (let si = 0; si < stones.length; si++) {
        const s = stones[si];
        const age = time - s.time;
        const ringDist = age * 80;
        const alpha = Math.exp(-age * 0.1) * 0.15;
        if (alpha > 0.005 && ringDist < pondRadius) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, ringDist, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(140,180,220,${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    // ── Diepte label (stil) ──
    if (!audioOn) {
      ctx.fillStyle = 'rgba(100,140,200,0.06)';
      ctx.font = '0.5em "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('diepte', cx, cy);
    }

    // ── Info ──
    if (!audioOn) {
      infoEl.textContent = 'spiegel — stil';
    } else if (rippleTime < 2) {
      infoEl.textContent = `rimpel — ${rippleTime.toFixed(1)}s`;
    } else if (rippleTime < 8) {
      infoEl.textContent = `interferentie — ${rippleTime.toFixed(1)}s`;
    } else {
      infoEl.textContent = `golven botsen — ${rippleTime.toFixed(1)}s`;
    }

    requestAnimationFrame(draw);
  }

  // ── Mode buttons ──
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      viewMode = btn.dataset.mode;
    });
  });

  // ── Steen gooien ──
  stoneBtn.addEventListener('click', () => {
    initAudio();
    audioOn = !audioOn;
    setAudio(audioOn);

    if (audioOn) {
      stones.push({
        x: cx + (Math.random() - 0.5) * 20,
        y: cy + (Math.random() - 0.5) * 20,
        time: time
      });
      stoneBtn.textContent = '● stil';
      stoneBtn.classList.add('rippled');
      elSub.textContent = 'steen → rimpel → interferentie → alles komt terug';
    } else {
      stones = [];
      rippleTime = 0;
      stoneBtn.textContent = '● steen gooien';
      stoneBtn.classList.remove('rippled');
      elSub.textContent = 'horizontaal (breedte) × verticaal (diepte) — de engine achter 0.0.0.0';
    }
  });

  // Click in cirkel = steen
  canvas.addEventListener('click', (e) => {
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > pondRadius * 1.1) return;

    if (!audioOn) {
      initAudio();
      audioOn = true;
      setAudio(true);
      stoneBtn.textContent = '● stil';
      stoneBtn.classList.add('rippled');
    }

    const sx = Math.min(Math.max(e.clientX, cx - pondRadius * 0.9), cx + pondRadius * 0.9);
    const sy = Math.min(Math.max(e.clientY, cy - pondRadius * 0.9), cy + pondRadius * 0.9);
    const sDx = sx - cx;
    const sDy = sy - cy;
    const sDist = Math.sqrt(sDx * sDx + sDy * sDy);

    if (sDist < pondRadius * 0.95) {
      stones.push({ x: sx, y: sy, time: time });
    }
  });

  draw();
})();
</script>
</body>
</html>
