<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>• 8×8 → Zee</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/main.css">
<style>
  #bit-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
  }

  #bit-ui {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: rgba(6, 6, 10, 0.85);
    padding: 12px 24px;
    border-radius: 12px;
    backdrop-filter: blur(12px);
    font-size: 0.7rem;
    color: var(--text-soft);
    transition: opacity 1s ease;
  }

  #bit-counter {
    color: var(--accent);
    font-size: 1.2rem;
    font-weight: bold;
  }

  #bit-phase {
    color: var(--yellow);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<nav id="nav-top">
  <a href="/" style="color:#7c6ef5;text-decoration:none;opacity:0.7;">• index</a>
  <a href="spectrum.html" style="color:#7c6ef5;text-decoration:none;opacity:0.7;">spectrum</a>
  <a href="licht.html" style="color:#a78bfa;text-decoration:none;opacity:0.7;">licht</a>
</nav>

<canvas id="bit-canvas"></canvas>

<div id="bit-ui">
  <div id="bit-counter">0 / 64</div>
  <div id="bit-phase">hexa structuur</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('bit-canvas');
  const ctx = canvas.getContext('2d');
  const counterEl = document.getElementById('bit-counter');
  const phaseEl = document.getElementById('bit-phase');
  const uiEl = document.getElementById('bit-ui');

  let W, H, cx, cy;

  // ── 8×8 Grid State ──
  const GRID = 8;
  const grid = []; // 8x8 array: 0=off, 1=on
  for (let r = 0; r < GRID; r++) {
    grid[r] = [];
    for (let c = 0; c < GRID; c++) grid[r][c] = 0;
  }

  // ── Phases ──
  // 0: bits aan (1 → 64)
  // 1: 24-bit willekeuring (bits flitsen willekeurig)
  // 2: zee (grid lost op, golven overal)
  let phase = 0;
  let bitsOn = 0;
  let time = 0;
  let cellStates = []; // per cell: {on: 0-1, flicker: 0-1}

  // Init cell states
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      cellStates.push({ row: r, col: c, on: 0, flicker: 0, chaosVal: 0 });
    }
  }

  // ── Audio ──
  let audioCtx = null;
  let noiseSource = null;
  let noiseGain = null;
  let filter = null;
  let masterGain = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // Eén white noise source — continue
    const bufSize = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = buf;
    noiseSource.loop = true;
    noiseSource.start();

    filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 200; // start: heel smal
    filter.Q.value = 0;

    noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.02; // heel zacht start

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.3;

    noiseSource.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  }

  // ── Resize ──
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Main Loop ──
  function draw() {
    // Fade — geen clearRect
    ctx.fillStyle = 'rgba(6, 6, 10, 0.03)';
    ctx.fillRect(0, 0, W, H);

    time += 0.016;

    if (phase === 0) {
      drawPhaseBits();
    } else if (phase === 1) {
      drawPhaseChaos();
    } else {
      drawPhaseSea();
    }

    requestAnimationFrame(draw);
  }

  // ── Phase 0: Bits Aan (0 → 64) ──
  // Eén bit per ~200ms. Hexa volgorde (midden → buiten)
  const hexaOrder = [];
  // Hexa: vanuit center naar buiten
  const center = 3.5;
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const dist = Math.sqrt((r - center) ** 2 + (c - center) ** 2);
      hexaOrder.push({ r, c, dist });
    }
  }
  hexaOrder.sort((a, b) => a.dist - b.dist);

  let bitIndex = 0;
  let lastBitTime = 0;
  const bitInterval = 0.2; // 200ms per bit

  function drawPhaseBits() {
    // Nieuwe bit aan?
    if (time - lastBitTime > bitInterval && bitIndex < 64) {
      const cell = hexaOrder[bitIndex];
      grid[cell.r][cell.c] = 1;
      bitsOn++;
      bitIndex++;
      lastBitTime = time;

      // Update audio: filter wordt breder naarmate meer bits aan
      const progress = bitsOn / 64;
      if (filter) {
        filter.frequency.setTargetAtTime(200 + progress * 3000, audioCtx.currentTime, 0.3);
      }
      if (noiseGain) {
        noiseGain.gain.setTargetAtTime(0.02 + progress * 0.08, audioCtx.currentTime, 0.3);
      }

      counterEl.textContent = bitsOn + ' / 64';
    }

    // Grid tekenen
    const cellW = Math.min(W * 0.7, H * 0.6) / GRID;
    const gridW = cellW * GRID;
    const gridH = cellW * GRID;
    const gx = (W - gridW) / 2;
    const gy = (H - gridH) / 2;

    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const x = gx + c * cellW;
        const y = gy + r * cellW;

        if (grid[r][c]) {
          // Bit aan — pulse
          const pulse = 0.7 + 0.3 * Math.sin(time * 3 + r + c);
          const alpha = 0.1 + pulse * 0.15;

          ctx.fillStyle = `rgba(124, 110, 245, ${alpha})`;
          ctx.fillRect(x + 1, y + 1, cellW - 2, cellW - 2);

          ctx.strokeStyle = `rgba(124, 110, 245, ${0.3 * pulse})`;
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x + 1, y + 1, cellW - 2, cellW - 2);
        } else {
          // Bit uit — zwakke outline
          ctx.strokeStyle = 'rgba(124, 110, 245, 0.05)';
          ctx.lineWidth = 0.3;
          ctx.strokeRect(x + 1, y + 1, cellW - 2, cellW - 2);
        }
      }
    }

    // Naar fase 1 als alle 64 bits aan
    if (bitsOn >= 64 && time - lastBitTime > 2) {
      phase = 1;
      phaseEl.textContent = '24-bit willekeuring';
    }
  }

  // ── Phase 1: 24-Bit Willekeuring ──
  // Bits flitsen willekeurig — chaos in het grid
  let chaosTime = 0;
  const chaosDuration = 8; // 8 seconden chaos

  function drawPhaseChaos() {
    chaosTime += 0.016;

    // Update audio: chaos = breed + hard
    if (filter) {
      const chaosFreq = 2000 + Math.sin(time * 13) * 2000;
      filter.frequency.setTargetAtTime(chaosFreq, audioCtx.currentTime, 0.1);
      filter.Q.setTargetAtTime(Math.random() * 5, audioCtx.currentTime, 0.1);
    }
    if (noiseGain) {
      noiseGain.gain.setTargetAtTime(0.08 + Math.random() * 0.06, audioCtx.currentTime, 0.1);
    }

    counterEl.textContent = '64 / 64 → ∞';

    // Grid tekenen — bits flitsen
    const cellW = Math.min(W * 0.7, H * 0.6) / GRID;
    const gridW = cellW * GRID;
    const gridH = cellW * GRID;
    const gx = (W - gridW) / 2;
    const gy = (H - gridH) / 2;

    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const x = gx + c * cellW;
        const y = gy + r * cellW;

        // Willekeurig aan/uit per frame
        const flicker = Math.sin(time * (7 + r * 3 + c * 11)) * Math.cos(time * (13 + c * 7 - r));
        const isOn = flicker > 0;

        if (isOn) {
          const alpha = 0.05 + Math.abs(flicker) * 0.2;
          // Kleur varieert met chaos
          const hue = (time * 50 + r * 45 + c * 90) % 360;
          ctx.fillStyle = `hsla(${260 + flicker * 30}, 50%, 60%, ${alpha})`;
          ctx.fillRect(x + 1, y + 1, cellW - 2, cellW - 2);
        }
      }
    }

    // Grid lines vertragen en lossen op
    const dissolve = Math.min(1, chaosTime / chaosDuration);
    if (dissolve < 0.8) {
      ctx.strokeStyle = `rgba(124, 110, 245, ${0.1 * (1 - dissolve)})`;
      ctx.lineWidth = 0.3;
      for (let i = 0; i <= GRID; i++) {
        // Horizontaal
        ctx.beginPath();
        ctx.moveTo(gx, gy + i * cellW);
        ctx.lineTo(gx + gridW, gy + i * cellW);
        ctx.stroke();
        // Verticaal
        ctx.beginPath();
        ctx.moveTo(gx + i * cellW, gy);
        ctx.lineTo(gx + i * cellW, gy + gridH);
        ctx.stroke();
      }
    }

    // Naar fase 2 (zee)
    if (chaosTime > chaosDuration) {
      phase = 2;
      phaseEl.textContent = 'zee';
      // Audio: filter sluit = zee-geruis
      if (filter) {
        filter.frequency.setTargetAtTime(400, audioCtx.currentTime, 2);
        filter.Q.setTargetAtTime(1, audioCtx.currentTime, 2);
      }
      if (noiseGain) {
        noiseGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 2);
      }
      counterEl.textContent = '∞';
    }
  }

  // ── Phase 2: Zee ──
  // Grid is opgelost — golven overal
  function drawPhaseSea() {
    const seaTime = time - chaosDuration - 2;

    // Meerdere golf-lagen
    const layers = [
      { freq: 0.003, speed: 0.15, amp: 30, color: 'rgba(100, 140, 220, 0.06)' },
      { freq: 0.005, speed: 0.25, amp: 20, color: 'rgba(124, 110, 245, 0.05)' },
      { freq: 0.008, speed: 0.1, amp: 25, color: 'rgba(100, 180, 255, 0.04)' },
      { freq: 0.012, speed: 0.35, amp: 12, color: 'rgba(140, 120, 255, 0.03)' },
    ];

    layers.forEach(function(w) {
      ctx.beginPath();
      for (let x = 0; x < W; x++) {
        const nx = x / W;
        // Bounded: fade naar 0 aan randen
        const envelope = Math.sin(nx * Math.PI);
        const wave = Math.sin(x * w.freq + seaTime * w.speed) * w.amp * envelope;
        const y = cy + wave;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });

    // Horizontale waterlijnen
    for (let i = 0; i < 8; i++) {
      const yBase = H * 0.15 + i * (H * 0.09);
      ctx.beginPath();
      for (let x = 0; x < W; x += 4) {
        const nx = x / W;
        const envelope = Math.sin(nx * Math.PI);
        const wave = Math.sin(x * 0.004 + seaTime * 0.2 + i * 2) * 10 * envelope;
        const y = yBase + wave;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(100, 140, 220, ${0.02 + Math.sin(seaTime + i) * 0.01})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Deeltjes = resten van het grid
    for (let i = 0; i < 20; i++) {
      const px = cx + Math.sin(seaTime * 0.3 + i * 1.7) * (W * 0.35);
      const py = cy + Math.cos(seaTime * 0.2 + i * 2.3) * (H * 0.3);
      const size = 1 + Math.sin(seaTime + i) * 0.5;

      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(124, 110, 245, ${0.05 + Math.sin(seaTime * 2 + i) * 0.03})`;
      ctx.fill();
    }
  }

  // ── Start on click ──
  canvas.addEventListener('click', function() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  });

  // Start
  draw();
})();
</script>
</body>
</html>
