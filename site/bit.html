<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>• 1 Bit Licht</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/main.css">
<style>
  #bit-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  #bit-ui {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: rgba(6, 6, 10, 0.9);
    padding: 16px 32px;
    border-radius: 12px;
    backdrop-filter: blur(12px);
  }

  #bit-stage {
    font-size: 0.8rem;
    color: var(--accent);
    text-align: center;
  }

  #bit-label {
    font-size: 0.65rem;
    color: var(--text-soft);
  }

  #play-btn, #autoplay-btn {
    padding: 8px 24px;
    border: 1px solid var(--accent);
    border-radius: 99px;
    background: transparent;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  #play-btn:hover, #autoplay-btn:hover {
    background: var(--accent);
    color: #06060a;
  }

  #autoplay-btn.active {
    background: var(--accent);
    color: #06060a;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  #speed-control {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }

  .speed-btn {
    padding: 4px 12px;
    border: 1px solid rgba(124, 110, 245, 0.3);
    border-radius: 4px;
    background: transparent;
    color: var(--text-soft);
    font-family: var(--mono);
    font-size: 0.65rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .speed-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .speed-btn.active {
    background: var(--accent);
    color: #06060a;
    border-color: var(--accent);
  }

  #autoplay-progress {
    width: 100px;
    height: 2px;
    background: rgba(124, 110, 245, 0.1);
    border-radius: 1px;
    overflow: hidden;
    margin-top: 4px;
  }

  #autoplay-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.1s linear;
  }

  .stage-bar {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }

  .stage-dot {
    width: 24px;
    height: 4px;
    border-radius: 2px;
    background: rgba(124, 110, 245, 0.2);
    transition: background 0.3s ease;
  }

  .stage-dot.active {
    background: var(--accent);
  }

  .stage-dot.done {
    background: var(--yellow);
  }
</style>
</head>
<body>
<!-- Top nav -->
<nav id="nav-top">
  <a href="/" style="color:#7c6ef5;text-decoration:none;opacity:0.7;">• index</a>
  <a href="spectrum.html" style="color:#7c6ef5;text-decoration:none;opacity:0.7;">spectrum</a>
  <a href="licht.html" style="color:#a78bfa;text-decoration:none;opacity:0.7;">licht</a>
</nav>

<canvas id="bit-canvas"></canvas>

<div id="bit-ui">
  <div id="bit-stage">0 = 1</div>
  <div id="bit-label">1 bit licht — statisch</div>
  <div class="stage-bar">
    <div class="stage-dot" data-stage="0"></div>
    <div class="stage-dot" data-stage="1"></div>
    <div class="stage-dot" data-stage="2"></div>
    <div class="stage-dot" data-stage="3"></div>
    <div class="stage-dot" data-stage="4"></div>
    <div class="stage-dot" data-stage="5"></div>
    <div class="stage-dot" data-stage="6"></div>
  </div>
  <div class="btn-row">
    <button id="play-btn">▶ PLAY</button>
    <button id="autoplay-btn">⏵ AUTO</button>
  </div>
  <div id="speed-control">
    <button class="speed-btn" data-speed="0.5">0.5×</button>
    <button class="speed-btn active" data-speed="1">1×</button>
    <button class="speed-btn" data-speed="2">2×</button>
  </div>
  <div id="autoplay-progress">
    <div id="autoplay-bar"></div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('bit-canvas');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('play-btn');
  const stageLabel = document.getElementById('bit-stage');
  const bitLabel = document.getElementById('bit-label');

  let W, H, cx, cy;
  let stage = 0; // 0=bit, 1=1wave(2^0), 2=2waves(2^1), 3=4waves(2^2), 4=8waves(2^3), 5=chaos, 6=mandelbrot→0
  let playing = false;
  let time = 0;
  let audioCtx = null;
  let currentOsc = null;
  let noiseNode = null;
  let autoplay = false;
  let autoplayTimer = null;
  let autoplayInterval = null;
  let autoplayDelay = 6000; // 6 seconden per stage
  let autoplayStart = 0;
  let speedMultiplier = 1; // 0.5 = langzaam, 1 = normaal, 2 = snel

  const stages = [
    { name: '0 = 1', label: 'bit licht — eenheid' },
    { name: '1 WAVE', label: '2⁰ — eerste beweging' },
    { name: '2 WAVES', label: '2¹ — verdubbeling' },
    { name: '4 WAVES', label: '2² — resonantie' },
    { name: '8 WAVES', label: '2³ — grens van orde' },
    { name: 'CHAOS', label: '>7 limiet → alles tegelijk' },
    { name: '0.0.0.0', label: '7 banden → echo = positie' },
  ];

  // ── Resize ──
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Audio ──
  let activeOscillators = [];
  let activeNoiseNode = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function stopAudio() {
    activeOscillators.forEach(function(o) {
      try { o.stop(); } catch(e) {}
    });
    activeOscillators = [];
    if (activeNoiseNode) {
      try { activeNoiseNode.stop(); } catch(e) {}
      activeNoiseNode = null;
    }
  }

  function playStageAudio(s) {
    initAudio();
    stopAudio();

    if (s === 0) {
      // 0=1: zuivere toon — eenheid
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 220;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      activeOscillators.push(osc);

    } else if (s === 1) {
      // 1 WAVE: 2⁰ — eerste beweging (zelfde toon, trilt)
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 220;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      activeOscillators.push(osc);

    } else if (s === 2) {
      // 2 WAVES: 2¹ — verdubbeling (octaaf)
      [110, 220].forEach(function(f) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.value = 0.07;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        activeOscillators.push(osc);
      });

    } else if (s === 3) {
      // 4 WAVES: 2² — resonantie (harmonische serie)
      [110, 165, 220, 330].forEach(function(f) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        activeOscillators.push(osc);
      });

    } else if (s === 4) {
      // 8 WAVES: 2³ — grens van orde (dichthelder)
      [55, 82.5, 110, 137.5, 165, 220, 275, 330].forEach(function(f) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.value = 0.03;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        activeOscillators.push(osc);
      });

    } else if (s === 5) {
      // CHAOS: >7 limiet → white noise (alles tegelijk)
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const source = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      source.buffer = buffer;
      source.loop = true;
      filter.type = 'lowpass';
      filter.frequency.value = 3000;
      gain.gain.value = 0.06;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      source.start();
      activeNoiseNode = source;

    } else if (s === 6) {
      // 0.0.0.0: 7 banden → audio stroomt naar center → echo = positie
      // 7 band-pass filters (P0→P6) + delay = return/echo
      const bands = [
        { freq: 55, q: 1 },     // P0: center
        { freq: 82.5, q: 1.5 }, // P1
        { freq: 110, q: 1 },    // P2
        { freq: 165, q: 2 },    // P3
        { freq: 220, q: 1.5 },  // P4
        { freq: 330, q: 2 },    // P5
        { freq: 440, q: 3 },    // P6
      ];

      // Bron: white noise (ru = potentieel)
      const bufSize = audioCtx.sampleRate * 2;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.loop = true;

      // 7 band filters → master gain
      const masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.02;
      masterGain.connect(audioCtx.destination);

      bands.forEach(function(b) {
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = b.freq;
        bp.Q.value = b.q;
        const g = audioCtx.createGain();
        g.gain.value = 1 / (bands.length); // even verdelen
        src.connect(bp);
        bp.connect(g);
        g.connect(masterGain);
      });

      // Delay = return/echo (snelheid = momentum, return = positie)
      const delay = audioCtx.createDelay();
      delay.delayTime.value = 0.5; // 500ms echo
      const delayGain = audioCtx.createGain();
      delayGain.gain.value = 0.3;
      masterGain.connect(delay);
      delay.connect(delayGain);
      delayGain.connect(audioCtx.destination);

      src.start();
      activeNoiseNode = src;
      activeOscillators.push(delay); // track for cleanup
    }
  }

  // ── Visuals ──
  function draw() {
    if (stage === 5) {
      // Chaos: trage fade → dichtheid opbouwt
      ctx.fillStyle = 'rgba(6, 6, 10, 0.05)';
      ctx.fillRect(0, 0, W, H);
    } else if (stage === 6) {
      // Mandelbrot: volledig herberekenen, geen fade
      // (geen action needed, imgData overschrijft)
    } else {
      // Stages 0-4: clean frame
      ctx.clearRect(0, 0, W, H);
    }

    time += 0.016;

    if (stage === 0) {
      // Single bit — pulse
      const pulse = 0.5 + 0.5 * Math.sin(time * 2);
      const r = 100 + pulse * 20;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(124, 110, 245, ${0.05 + pulse * 0.05})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(124, 110, 245, ${0.3 + pulse * 0.2})`;
      ctx.lineWidth = 1;
      ctx.stroke();

    } else if (stage === 1) {
      // 1 WAVE: 2⁰ — eerste beweging
      ctx.beginPath();
      for (let x = 0; x < W; x++) {
        const t = (x / W) * Math.PI * 4;
        const y = cy + Math.sin(t + time * 0.5) * 120;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(124, 110, 245, 0.7)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

    } else if (stage === 2) {
      // 2 WAVES: 2¹ — verdubbeling
      const waves = [
        { amp: 120, freq: 1, speed: 0.5, color: 'rgba(124, 110, 245, 0.6)' },
        { amp: 90, freq: 2, speed: 0.4, color: 'rgba(251, 191, 36, 0.5)' },
      ];
      waves.forEach(function(w) {
        ctx.beginPath();
        for (let x = 0; x < W; x++) {
          const t = (x / W) * Math.PI * 4;
          const y = cy + Math.sin(t * w.freq + time * w.speed) * w.amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = w.color;
        ctx.lineWidth = 2;
        ctx.stroke();
      });

    } else if (stage === 3) {
      // 4 WAVES: 2² — resonantie
      const waves = [
        { amp: 100, freq: 1, speed: 0.5, color: 'rgba(124, 110, 245, 0.5)' },
        { amp: 80, freq: 1.5, speed: 0.4, color: 'rgba(251, 191, 36, 0.45)' },
        { amp: 65, freq: 2, speed: 0.35, color: 'rgba(142, 202, 230, 0.4)' },
        { amp: 50, freq: 3, speed: 0.3, color: 'rgba(167, 139, 250, 0.35)' },
      ];
      waves.forEach(function(w) {
        ctx.beginPath();
        for (let x = 0; x < W; x++) {
          const t = (x / W) * Math.PI * 4;
          const y = cy + Math.sin(t * w.freq + time * w.speed) * w.amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = w.color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

    } else if (stage === 4) {
      // 8 WAVES: 2³ — grens van orde
      const waves = [
        { amp: 85, freq: 1, speed: 0.5, color: 'rgba(124, 110, 245, 0.4)' },
        { amp: 75, freq: 1.25, speed: 0.45, color: 'rgba(167, 139, 250, 0.35)' },
        { amp: 65, freq: 1.5, speed: 0.4, color: 'rgba(251, 191, 36, 0.4)' },
        { amp: 60, freq: 1.75, speed: 0.38, color: 'rgba(142, 202, 230, 0.35)' },
        { amp: 55, freq: 2, speed: 0.35, color: 'rgba(124, 110, 245, 0.3)' },
        { amp: 45, freq: 2.5, speed: 0.3, color: 'rgba(251, 191, 36, 0.3)' },
        { amp: 40, freq: 3, speed: 0.28, color: 'rgba(167, 139, 250, 0.25)' },
        { amp: 35, freq: 3.5, speed: 0.25, color: 'rgba(142, 202, 230, 0.25)' },
      ];
      waves.forEach(function(w) {
        ctx.beginPath();
        for (let x = 0; x < W; x++) {
          const t = (x / W) * Math.PI * 4;
          const y = cy + Math.sin(t * w.freq + time * w.speed) * w.amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = w.color;
        ctx.lineWidth = 1;
        ctx.stroke();
      });

    } else if (stage === 5) {
      // CHAOS: >7 limiet — overlappende golven → white noise dichtheid
      for (let g = 0; g < 40; g++) {
        ctx.beginPath();
        const amp = Math.random() * H * 0.4;
        const freq = Math.random() * 0.05 + 0.001;
        const spd = Math.random() * 0.1;
        const phase = Math.random() * Math.PI * 2;
        const hue = Math.random() * 60 + 240;
        for (let x = 0; x < W; x++) {
          const y = cy + Math.sin(x * freq + time * spd + phase) * amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = `hsla(${hue}, 60%, 70%, 0.04)`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

    } else if (stage === 6) {
      // 0.0.0.0: 7 banden → center → echo = positie
      // Hexagonale structuur, audio stroomt naar center
      // Snelheid = momentum, return/echo = positie

      const bands = [55, 82.5, 110, 165, 220, 330, 440];
      const bandColors = [
        'rgba(124,110,245,', // P0
        'rgba(167,139,250,', // P1
        'rgba(251,191,36,',  // P2
        'rgba(142,202,230,', // P3
        'rgba(124,110,245,', // P4
        'rgba(167,139,250,', // P5
        'rgba(251,191,36,',  // P6
      ];

      // 7 spiraalvormige banen naar center
      bands.forEach(function(b, i) {
        const radius = 100 + i * 60 + Math.sin(time * 0.3 + i) * 30;
        const angleOffset = (i / 7) * Math.PI * 2 + time * 0.1;

        ctx.beginPath();
        for (let a = 0; a < Math.PI * 2; a += 0.05) {
          const r = radius * (1 - a / (Math.PI * 4)); // spiraal naar binnen
          const angle = a + angleOffset;
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;
          if (a === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        const alpha = 0.15 + Math.sin(time * 0.5 + i) * 0.1;
        ctx.strokeStyle = bandColors[i] + alpha + ')';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // Center: 0.0.0.0 (hexagonaal punt)
      const hexPulse = 15 + Math.sin(time * 0.8) * 5;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 - Math.PI / 6;
        const x = cx + Math.cos(angle) * hexPulse;
        const y = cy + Math.sin(angle) * hexPulse;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(124,110,245,0.2)';
      ctx.fill();

      // Echo/return: concentrische cirkels die uitbreiden (snelheid → positie)
      for (let e = 0; e < 3; e++) {
        const echoPhase = (time * 0.4 + e * 2) % 6;
        const echoRadius = echoPhase * 50;
        const echoAlpha = Math.max(0, 0.3 - echoPhase * 0.05);
        ctx.beginPath();
        ctx.arc(cx, cy, echoRadius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,255,255,${echoAlpha})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    requestAnimationFrame(draw);
  }

  // ── Stage progression ──
  function advanceStage() {
    if (stage < 6) {
      stage++;
    } else {
      // Loop back
      stage = 0;
    }
    updateUI();
    playStageAudio(stage);
    // Reset autoplay timer if active
    if (autoplay) {
      autoplayStart = Date.now();
      document.getElementById('autoplay-bar').style.width = '0%';
    }
  }

  function updateUI() {
    stageLabel.textContent = stages[stage].name;
    bitLabel.textContent = stages[stage].label;

    document.querySelectorAll('.stage-dot').forEach(function(dot, i) {
      dot.classList.remove('active', 'done');
      if (i === stage) dot.classList.add('active');
      else if (i < stage) dot.classList.add('done');
    });

    playBtn.textContent = stage === 0 ? '▶ PLAY' : '→ VOLGENDE';
  }

  // ── Speed control ──
  document.querySelectorAll('.speed-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.speed-btn').forEach(function(b) {
        b.classList.remove('active');
      });
      this.classList.add('active');
      speedMultiplier = parseFloat(this.getAttribute('data-speed'));
      autoplayDelay = 6000 / speedMultiplier;
      // Restart autoplay timer if active
      if (autoplay) {
        startAutoplay();
      }
    });
  });

  // ── Events ──
  playBtn.addEventListener('click', advanceStage);

  // Autoplay toggle
  const autoplayBtn = document.getElementById('autoplay-btn');
  autoplayBtn.addEventListener('click', function() {
    autoplay = !autoplay;
    this.textContent = autoplay ? '⏸ PAUSE' : '⏵ AUTO';
    this.classList.toggle('active', autoplay);

    if (autoplay) {
      startAutoplay();
    } else {
      stopAutoplay();
    }
  });

  function startAutoplay() {
    stopAutoplay();
    autoplayStart = Date.now();
    autoplayTimer = setInterval(function() {
      advanceStage();
      autoplayStart = Date.now();
    }, autoplayDelay);
    // Start progress bar animation
    updateProgressBar();
  }

  function stopAutoplay() {
    if (autoplayTimer) {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
    }
    if (autoplayInterval) {
      cancelAnimationFrame(autoplayInterval);
      autoplayInterval = null;
    }
    // Reset progress bar
    document.getElementById('autoplay-bar').style.width = '0%';
  }

  function updateProgressBar() {
    if (!autoplay) return;
    const elapsed = Date.now() - autoplayStart;
    const progress = Math.min(elapsed / autoplayDelay * 100, 100);
    document.getElementById('autoplay-bar').style.width = progress + '%';
    autoplayInterval = requestAnimationFrame(updateProgressBar);
  }

  // Keyboard
  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space') { e.preventDefault(); advanceStage(); }
    if (e.code === 'KeyA') { autoplayBtn.click(); }
  });

  // ── Start ──
  updateUI();
  draw();
})();
</script>
</body>
</html>
