<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexa Audio Graph — Dimensional Frequency Network</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--cyan:#00ffff;
    --cyan-dim:#00aaff;--cyan-glow:rgba(0,255,255,.15);--white:#e8e8e8;
    --text:#c0c0c0;--dim:#555;--panel-w:380px;
  }
  html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--white);overflow:hidden}

  /* ── Header / Controls ── */
  #header{
    position:fixed;top:0;left:0;right:0;height:52px;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;background:linear-gradient(180deg,rgba(10,10,10,.97),rgba(10,10,10,.7));
    border-bottom:1px solid #222;backdrop-filter:blur(8px);
  }
  #header h1{font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--cyan)}
  #header h1 span{font-weight:300;color:var(--dim);font-size:11px;margin-left:8px;letter-spacing:1px;text-transform:none}

  .freq-modes{display:flex;gap:6px}
  .freq-btn{
    padding:6px 14px;border:1px solid #333;border-radius:20px;background:transparent;
    color:var(--text);font-size:12px;cursor:pointer;transition:all .25s;font-family:inherit;
  }
  .freq-btn:hover{border-color:var(--cyan-dim);color:var(--cyan)}
  .freq-btn.active{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-glow);box-shadow:0 0 12px var(--cyan-glow)}

  .controls{display:flex;align-items:center;gap:12px}
  .ctrl-btn{
    padding:5px 12px;border:1px solid #333;border-radius:6px;background:transparent;
    color:var(--dim);font-size:11px;cursor:pointer;transition:all .2s;font-family:inherit;
  }
  .ctrl-btn:hover{color:var(--cyan);border-color:var(--cyan-dim)}

  /* ── Canvas ── */
  #graph-container{
    position:fixed;top:52px;left:0;right:0;bottom:0;
    transition:right .4s cubic-bezier(.4,0,.2,1);
  }
  #graph-container.panel-open{right:var(--panel-w)}
  canvas#graph{display:block;width:100%;height:100%}

  /* ── Story Panel ── */
  #story-panel{
    position:fixed;top:52px;right:0;bottom:0;width:var(--panel-w);
    background:var(--surface);border-left:1px solid #222;z-index:90;
    transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;overflow-x:hidden;
  }
  #story-panel.open{transform:translateX(0)}

  .panel-close{
    position:absolute;top:12px;right:12px;width:30px;height:30px;border:none;
    background:transparent;color:var(--dim);font-size:18px;cursor:pointer;
    border-radius:50%;transition:all .2s;display:flex;align-items:center;justify-content:center;
  }
  .panel-close:hover{color:var(--cyan);background:var(--cyan-glow)}

  .panel-content{padding:28px 24px 40px}
  .panel-dim{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--cyan-dim);margin-bottom:6px}
  .panel-title{font-size:20px;font-weight:600;margin-bottom:18px;line-height:1.3;color:var(--white)}
  .panel-divider{height:1px;background:linear-gradient(90deg,var(--cyan),transparent);margin:18px 0}

  .panel-section{margin-bottom:20px}
  .panel-section h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
  .panel-section p{font-size:14px;line-height:1.75;color:var(--text)}
  .panel-math{
    background:var(--surface2);border:1px solid #222;border-radius:8px;
    padding:14px 16px;font-family:'Fira Code','Cascadia Code','Consolas',monospace;
    font-size:12px;line-height:1.8;color:var(--cyan-dim);
  }
  .panel-freq-display{
    display:flex;align-items:center;gap:10px;padding:14px 16px;
    background:var(--cyan-glow);border:1px solid rgba(0,255,255,.2);border-radius:8px;margin-bottom:20px;
  }
  .panel-freq-display .freq-val{font-size:28px;font-weight:700;color:var(--cyan);font-family:'Fira Code',monospace}
  .panel-freq-display .freq-unit{font-size:13px;color:var(--cyan-dim)}

  .panel-zig{
    background:var(--surface2);border:1px solid #222;border-radius:8px;
    padding:12px 16px;font-size:12px;line-height:1.7;
  }
  .zig-pass{color:#4ade80}
  .zig-warn{color:#facc15}
  .panel-connections{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .conn-tag{
    padding:3px 10px;border:1px solid #333;border-radius:12px;font-size:11px;
    color:var(--text);cursor:pointer;transition:all .2s;
  }
  .conn-tag:hover{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-glow)}

  /* ── Tooltip ── */
  #tooltip{
    position:fixed;pointer-events:none;background:rgba(17,17,17,.95);
    border:1px solid #333;border-radius:6px;padding:6px 12px;font-size:12px;
    color:var(--white);z-index:200;opacity:0;transition:opacity .15s;
    backdrop-filter:blur(6px);
  }
  #tooltip.show{opacity:1}
  #tooltip .tt-title{font-weight:600}
  #tooltip .tt-freq{color:var(--cyan);font-family:monospace;margin-left:6px}

  /* ── Legend ── */
  #legend{
    position:fixed;bottom:16px;left:16px;z-index:50;
    background:rgba(17,17,17,.85);border:1px solid #222;border-radius:8px;
    padding:12px 16px;font-size:11px;color:var(--dim);backdrop-filter:blur(6px);
  }

  #legend div:last-child{margin-bottom:0}
  .legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

  /* ── Scrollbar ── */
  #story-panel::-webkit-scrollbar{width:4px}

  .live-indicator{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s ease-in-out infinite;margin-right:8px;vertical-align:middle}

  /* ── Responsive ── */
  @media(max-width:768px){
    :root{--panel-w:100vw}
    #graph-container.panel-open{right:0}
    #header h1 span{display:none}
    .freq-btn{padding:5px 10px;font-size:11px}
    #legend{display:none}
  }
</style>

// ═══════════════════════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════════════════════
const AudioEngine = (() => {
  let ctx, masterGain;
  const activeOscillators = new Map();

  function init() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.3;
      masterGain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function play(nodeId, freq) {
    init();
    stop(nodeId);

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.25, now + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 2.6);

    activeOscillators.set(nodeId, { osc, gain });

    // Harmonic overtone (subtle)
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, now);
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(0.06, now + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
    osc2.connect(gain2);
    gain2.connect(masterGain);
    osc2.start(now);
    osc2.stop(now + 2.1);
    activeOscillators.set(nodeId + '_overtone', { osc: osc2, gain: gain2 });
  }

  function stop(nodeId) {
    const o1 = activeOscillators.get(nodeId);
    const o2 = activeOscillators.get(nodeId + '_overtone');
    [o1, o2].forEach(o => {
      if (o) {
        try { o.gain.gain.cancelScheduledValues(ctx.currentTime); } catch(e) {}
        try { o.gain.gain.setValueAtTime(0, ctx.currentTime); } catch(e) {}
        try { o.osc.stop(ctx.currentTime + 0.05); } catch(e) {}
      }
    });
    activeOscillators.delete(nodeId);
    activeOscillators.delete(nodeId + '_overtone');
  }

  return { init, play, stop };
})();

// STATE
// ═══════════════════════════════════════════════════════════
const MODES = { '440': 1.0, '432': 432/440, '396': 396/440 };

// ═══════════════════════════════════════════════════════════
// FORCE-DIRECTED GRAPH
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('graph');
const c = canvas.getContext('2d');
let W, H;
const NODE_R = 22;
const PADDING = 60;

// Node simulation state
const nodes = GRAPH_DATA.nodes.map(n => ({
  ...n,
  x: 0, y: 0, vx: 0, vy: 0,
  connected: new Set(),
  inLoop: false
}));

// Adjacency
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);
GRAPH_DATA.edges.forEach(e => {
  if (nodeMap[e.from]) nodeMap[e.from].connected.add(e.to);
  if (nodeMap[e.to]) nodeMap[e.to].connected.add(e.from);
});

// Find nidra loops (cycles in undirected sense — bidirectional edges)
const edgeSet = new Set();
GRAPH_DATA.edges.forEach(e => edgeSet.add(`${e.from}-${e.to}`));
const nidraEdges = [];
GRAPH_DATA.edges.forEach(e => {
  const rev = `${e.to}-${e.from}`;
  if (edgeSet.has(rev)) {
    nidraEdges.push(e);
    nodeMap[e.from].inLoop = true;
    nodeMap[e.to].inLoop = true;
  }
});

function resize() {
  const container = document.getElementById('graph-container');
  const rect = container.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initPositions() {
  const cx = W / 2, cy = H / 2;
  const radius = Math.min(W, H) * 0.3;
  nodes.forEach((n, i) => {
    const angle = (2 * Math.PI * i) / nodes.length - Math.PI / 2;
    n.x = cx + radius * Math.cos(angle) + (Math.random() - 0.5) * 40;
    n.y = cy + radius * Math.sin(angle) + (Math.random() - 0.5) * 40;
    n.vx = 0; n.vy = 0;
  });
}

// Force simulation
function simulate() {
  const k = 120; // ideal distance
  const repulsion = 8000;
  const attraction = 0.005;
  const centerForce = 0.002;
  const damping = 0.85;
  const cx = W / 2, cy = H / 2;

  // Reset forces
  nodes.forEach(n => { n.fx = 0; n.fy = 0; });

  // Repulsion (all pairs)
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = repulsion / (dist * dist);
      a.fx += (dx / dist) * force;
      a.fy += (dy / dist) * force;
      b.fx -= (dx / dist) * force;
      b.fy -= (dy / dist) * force;
    }
  }

  // Attraction (edges)
  GRAPH_DATA.edges.forEach(e => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return;
    let dx = b.x - a.x, dy = b.y - a.y;
    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
    let force = (dist - k) * attraction;
    a.fx += (dx / dist) * force;
    a.fy += (dy / dist) * force;
    b.fx -= (dx / dist) * force;
    b.fy -= (dy / dist) * force;
  });

  // Center gravity
  nodes.forEach(n => {
    n.fx += (cx - n.x) * centerForce;
    n.fy += (cy - n.y) * centerForce;
  });

  // Apply forces
  nodes.forEach(n => {
    n.vx = (n.vx + n.fx) * damping;
    n.vy = (n.vy + n.fy) * damping;
    n.x += n.vx;
    n.y += n.vy;
    // Boundary
    n.x = Math.max(PADDING + NODE_R, Math.min(W - PADDING - NODE_R, n.x));
    n.y = Math.max(PADDING + NODE_R + 52, Math.min(H - PADDING - NODE_R, n.y));
  });
}

// ═══════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════
let time = 0;
let hoveredNode = null;
let draggingNode = null;

function getFreq(nodeId) {
  const n = nodeMap[nodeId];
  return n ? n.freq_base * MODES[currentMode] : 0;
}

function isConnected(a, b) {
  return nodeMap[a] && nodeMap[a].connected.has(b);
}

function render() {
  time += 0.016;
  simulate();

  c.clearRect(0, 0, W, H);

  // Background subtle grid
  c.strokeStyle = 'rgba(255,255,255,0.015)';
  c.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = 0; y < H; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }

  // Determine highlight set
  const highlightEdges = new Set();
  const highlightNodes = new Set();
  if (selectedNodeId) {
    highlightNodes.add(selectedNodeId);
    nodes.forEach(n => {
      if (n.connected.has(selectedNodeId)) highlightNodes.add(n.id);
    });
    GRAPH_DATA.edges.forEach((e, i) => {
      if (e.from === selectedNodeId || e.to === selectedNodeId) highlightEdges.add(i);
    });
  }

  // Draw edges
  GRAPH_DATA.edges.forEach((e, i) => {
    const a = nodeMap[e.from], b = nodeMap[e.to];
    if (!a || !b) return;
    const isHighlighted = highlightEdges.has(i);
    const isNidra = nidraEdges.includes(e);
    const isNidraHighlighted = showNidraLoops && isNidra;

    if (isHighlighted) {
      // Glow
      c.save();
      c.shadowColor = 'rgba(0,255,255,0.5)';
      c.shadowBlur = 12;
      c.strokeStyle = 'rgba(0,255,255,0.7)';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(a.x, a.y);
      c.lineTo(b.x, b.y);
      c.stroke();
      c.restore();

      // Animated particle along edge
      const t = (Math.sin(time * 2 + i) + 1) / 2;
      const px = a.x + (b.x - a.x) * t;
      const py = a.y + (b.y - a.y) * t;
      c.beginPath();
      c.arc(px, py, 3, 0, Math.PI * 2);
      c.fillStyle = 'rgba(0,255,255,0.8)';
      c.fill();
    } else if (isNidraHighlighted) {
      const pulse = (Math.sin(time * 3 + i * 0.7) + 1) / 2;
      c.save();
      c.shadowColor = `rgba(74,222,128,${0.3 + pulse * 0.3})`;
      c.shadowBlur = 10;
      c.strokeStyle = `rgba(74,222,128,${0.4 + pulse * 0.3})`;
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(a.x, a.y);
      c.lineTo(b.x, b.y);
      c.stroke();
      c.restore();
    } else {
      c.strokeStyle = 'rgba(255,255,255,0.06)';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(a.x, a.y);
      c.lineTo(b.x, b.y);
      c.stroke();
    }
  });

  // Draw nodes
  nodes.forEach(n => {
    const isSelected = selectedNodeId === n.id;
    const isHighlighted = highlightNodes.has(n.id);
    const isHovered = hoveredNode && hoveredNode.id === n.id;
    const baseR = NODE_R;
    const freq = getFreq(n.id);

    // Pulse
    const pulse = isSelected ? (Math.sin(time * 4) + 1) / 2 : (Math.sin(time * 1.5 + parseInt(n.id) * 0.5) + 1) / 2;
    const glowR = isSelected ? 25 + pulse * 10 : isHovered ? 18 + pulse * 5 : 8 + pulse * 3;

    // Outer glow
    if (isSelected || isHighlighted) {
      c.save();
      const grad = c.createRadialGradient(n.x, n.y, baseR, n.x, n.y, baseR + glowR);
      if (isSelected) {
        grad.addColorStop(0, 'rgba(0,255,255,0.3)');
        grad.addColorStop(1, 'rgba(0,255,255,0)');
      } else {
        grad.addColorStop(0, 'rgba(0,170,255,0.2)');
        grad.addColorStop(1, 'rgba(0,170,255,0)');
      }
      c.fillStyle = grad;
      c.beginPath();
      c.arc(n.x, n.y, baseR + glowR, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    // Node circle
    const grad = c.createRadialGradient(n.x - 4, n.y - 4, 2, n.x, n.y, baseR);
    if (isSelected) {
      grad.addColorStop(0, '#00ffff');
      grad.addColorStop(1, '#0088aa');
    } else if (isHighlighted) {
      grad.addColorStop(0, '#00aaff');
      grad.addColorStop(1, '#005577');
    } else {
      grad.addColorStop(0, '#333');
      grad.addColorStop(1, '#1a1a1a');
    }

    c.beginPath();
    c.arc(n.x, n.y, baseR, 0, Math.PI * 2);
    c.fillStyle = grad;
    c.fill();

    // Border
    c.beginPath();
    c.arc(n.x, n.y, baseR, 0, Math.PI * 2);
    if (isSelected) {
      c.strokeStyle = 'rgba(0,255,255,0.9)';
      c.lineWidth = 2;
    } else if (isHighlighted) {
      c.strokeStyle = 'rgba(0,170,255,0.5)';
      c.lineWidth = 1.5;
    } else if (isHovered) {
      c.strokeStyle = 'rgba(0,255,255,0.4)';
      c.lineWidth = 1;
    } else {
      c.strokeStyle = 'rgba(255,255,255,0.1)';
      c.lineWidth = 1;
    }
    c.stroke();

    // Nidra indicator
    if (n.inLoop) {
      c.beginPath();
      c.arc(n.x, n.y - baseR - 6, 3, 0, Math.PI * 2);
      c.fillStyle = showNidraLoops ? 'rgba(74,222,128,0.8)' : 'rgba(74,222,128,0.2)';
      c.fill();
    }

    // Node label (ID)
    c.font = `bold ${isSelected ? 12 : 10}px 'Fira Code', monospace`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    if (isSelected) {
      c.fillStyle = '#000';
      c.fillText(n.id, n.x, n.y);
    } else if (isHighlighted) {
      c.fillStyle = 'rgba(0,255,255,0.8)';
      c.fillText(n.id, n.x, n.y);
    } else if (isHovered) {
      c.fillStyle = 'rgba(0,255,255,0.6)';
      c.fillText(n.id, n.x, n.y);
    } else {
      c.fillStyle = 'rgba(255,255,255,0.4)';
      c.fillText(n.id, n.x, n.y);
    }

    // Freq label below
    if (isSelected || isHovered) {
      c.font = '9px monospace';
      c.fillStyle = 'rgba(0,255,255,0.6)';
      c.fillText(freq.toFixed(1) + ' Hz', n.x, n.y + baseR + 14);
    }
  });

  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════════
function getNodeAt(x, y) {
  for (const n of nodes) {
    const dx = x - n.x, dy = y - n.y;
    if (dx * dx + dy * dy <= (NODE_R + 5) * (NODE_R + 5)) return n;
  }
  return null;
}

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousemove', e => {
  const { x, y } = getMousePos(e);
  const node = getNodeAt(x, y);

  if (draggingNode) {
    draggingNode.x = x;
    draggingNode.y = y;
    draggingNode.vx = 0;
    draggingNode.vy = 0;
    canvas.style.cursor = 'grabbing';
    return;
  }

  if (node) {
    hoveredNode = node;
    canvas.style.cursor = 'pointer';
    // Tooltip
    const tooltip = document.getElementById('tooltip');
    const freq = getFreq(node.id);
    tooltip.innerHTML = `<span class="tt-title">${node.title}</span><span class="tt-freq">${freq.toFixed(1)} Hz</span>`;
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY - 30) + 'px';
    tooltip.classList.add('show');
  } else {
    hoveredNode = null;
    canvas.style.cursor = 'default';
    document.getElementById('tooltip').classList.remove('show');
  }
});

canvas.addEventListener('mousedown', e => {
  const { x, y } = getMousePos(e);
  const node = getNodeAt(x, y);
  if (node) {
    draggingNode = node;
  }
});

canvas.addEventListener('mouseup', e => {
  if (draggingNode) {
    // If barely moved, treat as click
    const { x, y } = getMousePos(e);
    draggingNode = null;
    canvas.style.cursor = 'pointer';
  }
});

canvas.addEventListener('click', e => {
  const { x, y } = getMousePos(e);
  const node = getNodeAt(x, y);
  if (node) {
    selectNode(node);
  } else {
    deselectAll();
  }
});

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const x = touch.clientX - rect.left, y = touch.clientY - rect.top;
  const node = getNodeAt(x, y);
  if (node) selectNode(node);
  else deselectAll();
}, { passive: false });

function selectNode(node) {
  selectedNodeId = node.id;
  const freq = getFreq(node.id);

  // Play audio
  AudioEngine.play(node.id, freq);
  console.log(`hexa-audio: playing ${node.id} @ ${freq.toFixed(2)} Hz [${currentMode} mode]`);

  // Show story panel
  showStoryPanel(node.id);
}

function deselectAll() {
  selectedNodeId = null;
  AudioEngine.stop(selectedNodeId || '');
  closeStoryPanel();
}

// ═══════════════════════════════════════════════════════════
// STORY PANEL
// ═══════════════════════════════════════════════════════════
const panel = document.getElementById('story-panel');
const panelBody = document.getElementById('panel-body');
const graphContainer = document.getElementById('graph-container');

function showStoryPanel(nodeId) {
  const story = STORIES[nodeId];
  const node = nodeMap[nodeId];
  const freq = getFreq(nodeId);
  if (!story) return;

  // Get connected node IDs
  const connectedIds = Array.from(node.connected).sort();

  let html = `
    <div class="panel-freq-display">
      <div class="freq-val">${freq.toFixed(1)}</div>
      <div class="freq-unit">Hz · ${currentMode} mode</div>
    </div>
    <div class="panel-dim">Article ${nodeId}</div>
    <div class="panel-title">${story.title}</div>
    <div class="panel-divider"></div>
    <div class="panel-section">
      <h3>Narrative</h3>
      <p>${story.english}</p>
    </div>
    <div class="panel-divider"></div>
    <div class="panel-section">
      <h3>Mathematics</h3>
      <div class="panel-math">${story.math}</div>
    </div>
  `;

  if (story.zig) {
    html += `
      <div class="panel-divider"></div>
      <div class="panel-section">
        <h3>Zig Tests</h3>
        <div class="panel-zig"><span class="zig-pass">●</span> ${story.zig}</div>
      </div>
    `;
  }

  if (connectedIds.length > 0) {
    html += `
      <div class="panel-divider"></div>
      <div class="panel-section">
        <h3>Connections (${connectedIds.length})</h3>
        <div class="panel-connections">
          ${connectedIds.map(id => `<span class="conn-tag" data-node="${id}">${nodeMap[id].title}</span>`).join('')}
        </div>
      </div>
    `;
  }

  panelBody.innerHTML = html;
  panel.classList.add('open');
  graphContainer.classList.add('panel-open');

  // Connection tag clicks
  panelBody.querySelectorAll('.conn-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const targetId = tag.dataset.node;
      const targetNode = nodeMap[targetId];
      if (targetNode) selectNode(targetNode);
    });
  });
}

function closeStoryPanel() {
  panel.classList.remove('open');
  graphContainer.classList.remove('panel-open');
}

document.getElementById('panel-close').addEventListener('click', deselectAll);

// ═══════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.freq-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.freq-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    console.log(`hexa-audio: freq mode set to ${currentMode} Hz`);

    // Re-play if something is selected
    if (selectedNodeId) {
      const freq = getFreq(selectedNodeId);
      AudioEngine.play(selectedNodeId, freq);
      console.log(`hexa-audio: replaying ${selectedNodeId} @ ${freq.toFixed(2)} Hz [${currentMode} mode]`);
      showStoryPanel(selectedNodeId);
    }
  });
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initPositions();
  deselectAll();
  console.log('hexa-audio: graph reset to initial positions');
});

document.getElementById('btn-nidra').addEventListener('click', () => {
  showNidraLoops = !showNidraLoops;
  const btn = document.getElementById('btn-nidra');
  btn.style.color = showNidraLoops ? 'var(--cyan)' : '';
  btn.style.borderColor = showNidraLoops ? 'var(--cyan)' : '';
  console.log(`hexa-audio: nidra loops ${showNidraLoops ? 'highlighted' : 'hidden'}`);
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize', resize);
resize();
initPositions();
requestAnimationFrame(render);

console.log('%c✦ Hexa Audio Graph initialized ✦', 'color:#00ffff;font-size:14px;font-weight:bold');
console.log(`  ${nodes.length} nodes · ${GRAPH_DATA.edges.length} edges · ${nidraEdges.length} nidra loops`);
console.log('  Click any node to hear its frequency and read its story.');
</script>
</body>
</html>
